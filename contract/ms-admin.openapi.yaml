                $ref: '#/components/schemas/PricesView'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    put:
      tags: [Administración]
      operationId: savePrices
      summary: "Guardar precios y descuento máximo (un solo «Guardar»)"
      description: "Saga \"Guardar precios y descuento máximo\": Schedule → Offers (`PublishFarePrices`) → `pricing.changed`. Descuento máximo 0–50 %."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePricesRequest'
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesView'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
