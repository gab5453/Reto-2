components:
  securitySchemes:
    PartnerOAuth2:
      $ref: './vuelos-openapi-v2.yaml#/components/securitySchemes/PartnerOAuth2'
    BearerAuth:
      $ref: './vuelos-openapi-v2.yaml#/components/securitySchemes/BearerAuth'
    PartnerClientBasic:
      $ref: './ms-g-identity.openapi.yaml#/components/securitySchemes/PartnerClientBasic'
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de usuario de la web (`token_use = user`), emitido por MS.G.Identity. Lo reenvía el gateway GraphQL.

  parameters:
    CorrelationId:
      $ref: './vuelos-openapi-v2.yaml#/components/parameters/CorrelationId'
    Sub:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/Sub'
    ClientId:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/ClientId'
    RouteId:
      $ref: './ms-g-schedule.openapi.yaml#/components/parameters/RouteId'
    Registration:
      $ref: './ms-g-schedule.openapi.yaml#/components/parameters/Registration'
    FlightNumber:
      $ref: './vuelos-openapi-v2.yaml#/components/parameters/FlightNumber'
    BookingId:
      $ref: './vuelos-openapi-v2.yaml#/components/parameters/BookingId'
    Date:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    DateFrom:
      name: from
      in: query
      description: Desde (fecha local, inclusive)
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      description: Hasta (fecha local, inclusive)
      schema:
        type: string
        format: date
    UserSearch:
      name: q
      in: query
      description: Busca en el correo y el nombre (sin distinguir mayúsculas)
      schema:
        type: string
        maxLength: 80
    RoleFilter:
      name: role
      in: query
      schema:
        $ref: './ms-g-identity.openapi.yaml#/components/schemas/RoleName'
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: './ms-g-identity.openapi.yaml#/components/schemas/AccountStatus'
    Limit:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/Limit'
    Cursor:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/Cursor'
    EventType:
      name: type
      in: query
      description: Tipo corto del evento (público o interno), p. ej. `booking.confirmed`
      schema:
        type: string
        maxLength: 60
    CorrelationIdFilter:
      name: correlationId
      in: query
      description: Solo los eventos de ese proceso (X-Correlation-Id)
      schema:
        type: string
        maxLength: 100
    CorrelationIdQuery:
      name: correlationId
      in: path
      required: true
      description: X-Correlation-Id del proceso a rastrear
      schema:
        type: string
        maxLength: 100

  responses:
    Problem400:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem400'
    Problem401:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem401'
    Problem403:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem403'
    Problem404:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem404'
    Problem409:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem409'
    Problem422:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem422'
    Problem429:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem429'
    Problem503:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem503'

  schemas:
    ProblemDetails:
      $ref: './vuelos-openapi-v2.yaml#/components/schemas/ProblemDetails'
    SavePricesRequest:
      type: object
      additionalProperties: false
      description: Un solo «Guardar» de la pantalla «Precios por clase» (D18, D35) → saga "Guardar precios y descuento máximo".
      properties:
        prices:
          $ref: './ms-g-schedule.openapi.yaml#/components/schemas/SaveFarePricesRequest'
        pricing:
          type: object
          additionalProperties: false
          description: Tarifa base y/o el precio exacto de los 4 paquetes de una ruta (P-1, 1.8.0). `route.prices` vacío lo quita.
          properties:
            fixedCharge: { type: number, minimum: 0, maximum: 500 }
            perKm: { type: number, minimum: 0.001, maximum: 5 }
            route:
              $ref: './ms-g-schedule.openapi.yaml#/components/schemas/RoutePrices'
        promotion:
          type: object
          additionalProperties: false
          required: [partnerId, agreement]
          properties:
            partnerId:
              type: string
              example: BOOKING_PROTOTIPO
            agreement:
              $ref: './vuelos-openapi-v2.yaml#/components/schemas/ContratoPromocionesRequest'

    PricesView:
      type: object
      additionalProperties: false
      required: [prices, pricing, promotions]
      properties:
        prices:
          $ref: './ms-g-schedule.openapi.yaml#/components/schemas/FarePriceTable'
        pricing:
          $ref: './ms-g-schedule.openapi.yaml#/components/schemas/PricingSettings'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/PartnerPromotionAgreement'

    PartnerPromotionAgreement:
      description: >-
        El acuerdo del contrato v2 más el partner al que pertenece. `proveedor_codigo` NO sirve para eso: es el código de la
        aerolínea (la misma en todos los acuerdos).
      allOf:
        - $ref: './vuelos-openapi-v2.yaml#/components/schemas/ContratoPromocionesResponse'
        - type: object
          required: [partnerId]
          properties:
            partnerId:
              type: string
              example: BOOKING_PROTOTIPO

    DashboardIndicators:
      type: object
      additionalProperties: false
      required: [generatedAt, bookings, users, flightsToday]
      description: Composición "Indicadores" (Bookings + Identity + FlightStatus).
      properties:
        generatedAt:
          type: string
          format: date-time
        bookings:
          $ref: './ms-g-bookings.openapi.yaml#/components/schemas/BookingSummary'
        users:
          $ref: './ms-g-identity.openapi.yaml#/components/schemas/UserSummary'
        flightsToday:
          type: integer

    ServiceHealth:
      type: object
      additionalProperties: false
      required: [service, status, checkedAt]
      properties:
        service:
          type: string
          example: ms-g-offers
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
        latency_ms:
          type: integer
        version:
          type: string
        checkedAt:
          type: string
          format: date-time

    LatencyByService:
      type: object
      additionalProperties: false
      required: [service, p50_ms, p95_ms, p99_ms, requests, errorRate]
      properties:
        service:
          type: string
        p50_ms:
          type: number
        p95_ms:
          type: number
        p99_ms:
          type: number
        requests:
          type: integer
        errorRate:
          type: number
          description: Porcentaje de respuestas 5xx en la ventana

    TraceStep:
      type: object
      additionalProperties: false
      required: [timestamp, service, operation, status, latency_ms]
      description: Una fila de `api_request_logs` (contrato v2 §6) o un span de la traza.
      properties:
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        operation:
          type: string
        status:
          type: string
        latency_ms:
          type: integer
        request_id:
          type: string
        trace_id:
          type: string
        span_id:
          type: string

    FlightDelayImpact:
      type: object
      description: Retrasos R-1. El impacto del avión viene de MS.G.FlightStatus; las reservas, de MS.G.Bookings.
      required: [flightNumber, date, delayMinutes, scheduledDepartureAt, scheduledArrivalAt, estimatedDepartureAt, estimatedArrivalAt, aircraft, nextFlight, bookings, passengers, tightConnections]
      properties:
        flightNumber: { type: string }
        date: { type: string, format: date }
        delayMinutes: { type: integer }
        scheduledDepartureAt: { type: string, format: date-time }
        scheduledArrivalAt: { type: string, format: date-time }
        estimatedDepartureAt: { type: string, format: date-time }
        estimatedArrivalAt: { type: string, format: date-time }
        aircraft:
          $ref: './ms-g-flight-status.openapi.yaml#/components/schemas/DelayImpact/properties/aircraft'
        nextFlight:
          $ref: './ms-g-flight-status.openapi.yaml#/components/schemas/DelayImpact/properties/nextFlight'
        bookings: { type: integer, description: Reservas activas del vuelo }
        passengers: { type: integer }
        tightConnections:
          type: array
          description: Reservas que quedan con menos margen que el de la búsqueda para su vuelo siguiente (conexión 60 min, vuelta 120 min)
          items:
            type: object
            required: [bookingId, pnr, channel, kind, nextFlightNumber, nextDepartureAt, availableMinutes, requiredMinutes]
            properties:
              bookingId: { type: string, format: uuid }
              pnr: { type: string }
              channel: { type: string, enum: [WEB, BOOKING] }
              kind: { type: string, enum: [CONNECTION, RETURN] }
              nextFlightNumber: { type: string }
              nextDepartureAt: { type: string, format: date-time }
              availableMinutes: { type: integer }
              requiredMinutes: { type: integer }
    BookingTimeline:
      type: object
      additionalProperties: false
      required: [bookingId, sagas, events]
      description: Historial de una reserva (panel O-2, 1.5.0) — sus sagas con los pasos y sus eventos con las entregas a Booking.
      properties:
        bookingId:
          type: string
          format: uuid
        sagas:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sagaId, type, status, correlationId, createdAt, updatedAt, steps]
            properties:
              sagaId:
                type: string
              type:
                type: string
              status:
                type: string
                enum: [RUNNING, COMPLETED, COMPENSATING, COMPENSATED, FAILED]
              correlationId:
                type: string
              parentSagaId:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              errorCode:
                type: string
                nullable: true
              steps:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name, status, at]
                  properties:
                    name:
                      type: string
                    status:
                      type: string
                      enum: [STARTED, DONE, COMPENSATED]
                    at:
                      type: string
                      format: date-time
        events:
          type: array
          items:
            $ref: './ms-g-webhooks.openapi.yaml#/components/schemas/EventHistoryItem'

    Journey:
      type: object
      additionalProperties: false
      required: [correlationId, startedAt, durationMs, traces, nodes, hops, truncated]
      description: |
        Vista «Recorrido» (1.12.0, T-4): los saltos de un proceso de servicio en servicio, desde sus spans en Tempo, en orden de
        tiempo. Solo nombres de servicio, operación (método y ruta sin query, o método gRPC), estado y tiempos: nunca datos personales.
      properties:
        correlationId:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: number
        traces:
          type: integer
          description: Cuántas trazas tiene el proceso (búsqueda, hold, pago, reserva…)
        window:
          type: object
          additionalProperties: false
          required: [from, to, source]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            source:
              type: string
              enum: [RANGE, RECORDS, DEFAULT]
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, layer]
            properties:
              id:
                type: string
                description: Nombre del servicio (`cliente` es quien llamó desde fuera)
              layer:
                type: string
                enum: [CLIENT, GATEWAY, RESPONSE, ESB, MANAGEMENT, EXTERNAL]
        hops:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sequence, from, to, operation, startMs, durationMs, status, traceId]
            properties:
              sequence:
                type: integer
              from:
                type: string
              to:
                type: string
              operation:
                type: string
              startMs:
                type: number
                description: Milisegundos desde el inicio del proceso
              durationMs:
                type: number
              status:
                type: string
                enum: [OK, ERROR]
              httpStatus:
                type: integer
              traceId:
                type: string
        truncated:
          type: boolean
          description: Hubo más saltos de los que se devuelven (300)

    SystemMap:
      type: object
      additionalProperties: false
      required: [generatedAt, windowMinutes, edges]
      description: Mapa del sistema en vivo (1.12.0, T-4) — aristas de los últimos minutos, del grafo de servicios de Tempo (T-3)
      properties:
        generatedAt:
          type: string
          format: date-time
        windowMinutes:
          type: integer
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [from, to, requestsPerMinute, errorsPerMinute]
            properties:
              from:
                type: string
              to:
                type: string
              requestsPerMinute:
                type: number
              errorsPerMinute:
                type: number
              p95Ms:
                type: number
                nullable: true

    CorrelationTrace:
      type: object
      additionalProperties: false
      required: [correlationId, steps]
      description: Todo lo que generó un proceso (contrato v2 §6), en orden.
      properties:
        correlationId:
          type: string
        window:
          type: object
          additionalProperties: false
          required: [from, to, source]
          description: Dónde se buscaron los pasos en Loki (1.9.0, T-2)
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            source:
              type: string
              enum: [RANGE, RECORDS, DEFAULT]
              description: '`RANGE` el rango pedido; `RECORDS` de sus sagas y eventos ±10 min; `DEFAULT` las últimas 3 h'
        stepsError:
          type: string
          description: Si Loki no respondió a tiempo, por qué faltan los pasos (las sagas y eventos sí vienen) (1.9.0)
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TraceStep'
        sagas:
          type: array
          items:
            type: object
            properties:
              sagaId:
                type: string
              type:
                type: string
              status:
                type: string
        events:
          $ref: './ms-g-webhooks.openapi.yaml#/components/schemas/EventHistoryPage'

    QueueStats:
      type: object
      additionalProperties: false
      required: [queue, messages, consumers]
      properties:
        queue:
          type: string
        messages:
          type: integer
        consumers:
          type: integer
        deadLetters:
          type: integer

    Alert:
      type: object
      additionalProperties: false
      required: [id, rule, severity, startedAt]
      properties:
        id:
          type: string
        rule:
          type: string
          example: servicio-caido
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
        service:
          type: string
        message:
          type: string
        startedAt:
          type: string
          format: date-time

    BookingIntegrationStatus:
      type: object
      additionalProperties: false
      required: [partnerId, webhooks, stock]
      description: Estado de la integración con Booking para el panel.
      properties:
        partnerId:
          type: string
        lastTokenAt:
          type: string
          format: date-time
          nullable: true
        webhooks:
          $ref: './ms-g-webhooks.openapi.yaml#/components/schemas/DeliveryStats'
        stock:
          type: object
          properties:
            lastPushAt:
              type: string
              format: date-time
              nullable: true
            pendingPushes:
              type: integer
        lastInboundEventAt:
          type: string
          format: date-time
          nullable: true

    AssistanceReadyRequest:
      type: object
      additionalProperties: false
      required: [passengerId, segmentId, ready]
      properties:
        passengerId:
          type: string
        segmentId:
          type: string
        ready:
          type: boolean
