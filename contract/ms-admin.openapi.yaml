openapi: 3.0.3
info:
  title: MS.Admin — panel de administración de EcoAirlines (respuesta)
  version: 1.12.0
  license:
    name: Uso académico — Integración de Sistemas (sin licencia de distribución)
  description: |
    Microservicio de respuesta **MS.Admin** de EcoAirlines (Reto 2, D14). **No implementa operaciones del contrato del grupo**:
    todas sus operaciones son propias, bajo `/ecoairlines/admin/...`, y solo las usa la web (vía GraphQL, D23) con el scope
    `ecoairlines:admin` (rol ADMIN). Para el **estado de vuelo**, el **panel de operaciones** y el **acuerdo de promociones** del
    contrato, el panel usa las operaciones de **MS.Vuelos** (D32).

    Los schemas se **referencian** desde los contratos internos de los MS.G (`ms-g-*.openapi.yaml`) y del grupo
    (`vuelos-openapi-v2.yaml`), salvo los de telemetría, que son de este servicio.

    | Grupo | Cadena en el ESB |
    |-------|------------------|
    | Usuarios, roles y partners | Enrutador → Identity (`X-Actor-Id` = `sub` del administrador) |
    | Precios y promociones | Enrutador (lectura) y saga "Guardar precios y descuento máximo" |
    | Rutas | Saga "Publicar horario" · flota y horario: enrutador → Schedule |
    | Asistencia por vuelo · indicadores | Composición |
    | Eventos | Enrutador → Webhooks (`GET /history`) |
    | Telemetría | Composición → plataforma de observabilidad (OpenTelemetry) e integración con Booking |

    ### Seguridad
    Solo **token de usuario** con el scope `ecoairlines:admin`. Un token de partner o de servicio responde `401`/`403`. Cada
    cambio lleva al ESB `X-Actor-Id` = `sub` del administrador (auditoría). Mismo procesamiento que los demás MS de respuesta
    (DTO, límite de peticiones, `X-Correlation-Id`, `ProblemDetails` v2).
servers:
  - url: http://ms-admin:8080/api/v2
    description: Red interna (detrás del gateway, que publica /api/v2/vuelos/* y /api/graphql)
  - url: http://localhost:5005/api/v2
    description: Desarrollo local
security:
  - UserJwt: [ecoairlines:admin]
tags:
  - name: Administración
    description: Panel de administración (solo vía GraphQL)
paths:
  /ecoairlines/admin/indicators:
    get:
      tags: [Administración]
      operationId: getIndicators
      summary: "Indicadores del panel"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardIndicators'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/users:
    get:
      tags: [Administración]
      operationId: listUsers
      summary: "Listar y buscar usuarios"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserSearch'
        - $ref: '#/components/parameters/RoleFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    post:
      tags: [Administración]
      operationId: createUser
      summary: "Crear un usuario con rol"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-identity.openapi.yaml#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
  /ecoairlines/admin/users/{sub}:
    get:
      tags: [Administración]
      operationId: getUser
      summary: "Detalle de un usuario"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Sub'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /ecoairlines/admin/users/{sub}/role:
    put:
      tags: [Administración]
      operationId: changeUserRole
      summary: "Cambiar el rol"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Sub'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-identity.openapi.yaml#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
  /ecoairlines/admin/users/{sub}/status:
    put:
      tags: [Administración]
      operationId: changeUserStatus
      summary: "Bloquear o activar"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Sub'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-identity.openapi.yaml#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
  /ecoairlines/admin/roles:
    get:
      tags: [Administración]
      operationId: listRoles
      summary: "Roles con sus permisos"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-g-identity.openapi.yaml#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/partners:
    get:
      tags: [Administración]
      operationId: listPartners
      summary: "Listar partners"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/PartnerList'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    post:
      tags: [Administración]
      operationId: createPartner
      summary: "Dar de alta un partner (el secreto se muestra una vez)"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-identity.openapi.yaml#/components/schemas/CreatePartnerRequest'
      responses:
        '201':
          description: Partner creado
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/PartnerWithSecret'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
  /ecoairlines/admin/partners/{clientId}:
    get:
      tags: [Administración]
      operationId: getPartner
      summary: "Detalle de un partner"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/Partner'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /ecoairlines/admin/partners/{clientId}/status:
    put:
      tags: [Administración]
      operationId: changePartnerStatus
      summary: "Bloquear o activar un partner"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-identity.openapi.yaml#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /ecoairlines/admin/partners/{clientId}/secret:
    post:
      tags: [Administración]
      operationId: rotatePartnerSecret
      summary: "Generar un secreto nuevo"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-identity.openapi.yaml#/components/schemas/PartnerWithSecret'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /ecoairlines/admin/prices:
    get:
      tags: [Administración]
      operationId: getPrices
      summary: "Precios por clase y acuerdos de promociones"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesView'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    put:
      tags: [Administración]
      operationId: savePrices
      summary: "Guardar precios y descuento máximo (un solo «Guardar»)"
      description: "Saga \"Guardar precios y descuento máximo\": Schedule → Offers (`PublishFarePrices`) → `pricing.changed`. Descuento máximo 0–50 %."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePricesRequest'
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesView'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
  /ecoairlines/admin/prices/reference:
    get:
      tags: [Administración]
      operationId: getReferencePrices
      summary: "Valores de referencia para «Rellenar» (no guarda)"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-g-schedule.openapi.yaml#/components/schemas/FarePriceItem'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/prices/history:
    get:
      tags: [Administración]
      operationId: getPriceHistory
      summary: "Historial de cambios de precios"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/PriceChangePage'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/routes:
    get:
      tags: [Administración]
      operationId: listRoutes
      summary: "Rutas programadas"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRoute'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    post:
      tags: [Administración]
      operationId: createRoute
      summary: "Crear una ruta (saga \"Publicar horario\")"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRouteRequest'
      responses:
        '201':
          description: Ruta creada y publicada
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRoute'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
  /ecoairlines/admin/routes/{routeId}:
    get:
      tags: [Administración]
      operationId: getRoute
      summary: "Detalle de una ruta"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRoute'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
    put:
      tags: [Administración]
      operationId: updateRoute
      summary: "Cambiar una ruta (saga \"Publicar horario\")"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRouteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRoute'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
    delete:
      tags: [Administración]
      operationId: deleteRoute
      summary: "Dar de baja una ruta (saga \"Publicar horario\")"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RouteId'
      responses:
        '204':
          description: Ruta eliminada
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
  /ecoairlines/admin/aircraft-types:
    get:
      tags: [Administración]
      operationId: listAircraftTypes
      summary: "Tipos de avión"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-g-schedule.openapi.yaml#/components/schemas/AircraftTypeInfo'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'

    post:
      tags: [Administración]
      operationId: createAircraftType
      summary: "Agregar un tipo de avión (1.11.0, M-2): Business y Economy con su distribución, alcance y tiempo en tierra"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-schedule.openapi.yaml#/components/schemas/CreateAircraftTypeRequest'
      responses:
        '201':
          description: Tipo agregado
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/AircraftTypeInfo'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
  /ecoairlines/admin/aircraft-types/{aircraftType}:
    put:
      tags: [Administración]
      operationId: updateAircraftType
      summary: "Editar un tipo sin aviones ni rutas (con aviones: 409 AIRCRAFT_TYPE_IN_USE, D-T7)"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: aircraftType
          in: path
          required: true
          description: Nombre del tipo, codificado
          schema:
            type: string
            maxLength: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-schedule.openapi.yaml#/components/schemas/AircraftTypeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/AircraftTypeInfo'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
    delete:
      tags: [Administración]
      operationId: deleteAircraftType
      summary: "Borrar un tipo sin aviones ni rutas"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: aircraftType
          in: path
          required: true
          description: Nombre del tipo, codificado
          schema:
            type: string
            maxLength: 60
      responses:
        '204':
          description: Borrado
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
  /ecoairlines/admin/aircraft:
    get:
      tags: [Administración]
      operationId: listAircraft
      summary: "Aviones de la flota"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-g-schedule.openapi.yaml#/components/schemas/Aircraft'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    post:
      tags: [Administración]
      operationId: createAircraft
      summary: "Agregar un avión"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-schedule.openapi.yaml#/components/schemas/AircraftRequest'
      responses:
        '201':
          description: Avión agregado
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/Aircraft'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/aircraft/{registration}:
    get:
      tags: [Administración]
      operationId: getAircraft
      summary: "Detalle de un avión"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Registration'
      responses:
        '200':
          description: OK
          content:
