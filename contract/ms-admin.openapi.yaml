    post:
      tags: [Administración]
      operationId: createPartner
      summary: "Dar de alta un partner (el secreto se muestra una vez)"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-identity.openapi.yaml#/components/schemas/CreatePartnerRequest'
