        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-g-bookings.openapi.yaml#/components/schemas/FlightAssistanceItem'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/bookings:
    get:
      tags: [Administración]
      operationId: listAdminBookings
      summary: "Reservas de todos los canales (solo lectura, 1.4.0)"
      description: "Enrutador → MS.G.Bookings `listBookings` con `X-Actor-Id`: cada ítem trae canal, orden de Booking, salida, pasajeros y reembolso."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: reference
          in: query
          description: PNR, orden de Booking o referencia del pago de la reserva, exactos
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          schema:
            $ref: './vuelos-openapi-v2.yaml#/components/schemas/BookingStatus'
        - name: channel
          in: query
          schema:
            $ref: './ms-g-bookings.openapi.yaml#/components/schemas/SalesChannelCode'
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-bookings.openapi.yaml#/components/schemas/BookingListView'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/bookings/{bookingId}:
    get:
      tags: [Administración]
      operationId: getAdminBooking
      summary: "Detalle de cualquier reserva (solo lectura, 1.4.0)"
      description: "Enrutador → MS.G.Bookings `getBooking` con `X-Actor-Id`: incluye canal, dueño, tarifas, reembolsos y pagos registrados."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-bookings.openapi.yaml#/components/schemas/BookingView'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /ecoairlines/admin/bookings/{bookingId}/timeline:
    get:
      tags: [Administración]
      operationId: getAdminBookingTimeline
      summary: "Historial de una reserva: sagas y eventos con sus entregas (solo lectura, 1.5.0)"
      description: "Composición del ESB: `saga_log` (sin la entrada ni el resultado de cada saga) + historial de Webhooks por `subject`."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTimeline'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/reports/sales:
    get:
      tags: [Administración]
      operationId: getSalesReport
      summary: "Ventas por día, canal y ruta, y la liquidación con Booking (solo lectura, 1.6.0)"
      description: "Enrutador → MS.G.Bookings `getSalesReport` con `X-Actor-Id`. Días en hora de Ecuador; máximo un año."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-bookings.openapi.yaml#/components/schemas/SalesReport'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/bookings/{bookingId}/assistance-ready:
    put:
      tags: [Administración]
      operationId: markAssistanceReady
      summary: "Marcar que el aeropuerto confirmó la asistencia"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceReadyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-check-in.openapi.yaml#/components/schemas/CheckInState'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /ecoairlines/admin/events:
    get:
      tags: [Administración]
      operationId: listEventHistory
      summary: "Historial de eventos y entregas"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/CorrelationIdFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-webhooks.openapi.yaml#/components/schemas/EventHistoryPage'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/telemetry/services:
    get:
      tags: [Administración]
      operationId: getServicesHealth
      summary: "Salud de cada servicio"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceHealth'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/telemetry/latency:
    get:
      tags: [Administración]
      operationId: getLatency
      summary: "Latencia y errores por servicio"
      description: "Datos de la plataforma de observabilidad (V2.16, D50: Prometheus, Loki, RabbitMQ y Alertmanager, por la composición del ESB). Si una pieza no responde: `503 PROVIDER_UNAVAILABLE`."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LatencyByService'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '503':
          $ref: '#/components/responses/Problem503'
  /ecoairlines/admin/telemetry/traces/{correlationId}:
    get:
      tags: [Administración]
      operationId: getCorrelationTrace
      summary: "Todo lo que generó un proceso, por su correlation ID"
      description: "Datos de la plataforma de observabilidad (V2.16, D50: Prometheus, Loki, RabbitMQ y Alertmanager, por la composición del ESB). Si una pieza no responde: `503 PROVIDER_UNAVAILABLE`."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CorrelationIdQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationTrace'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '503':
          $ref: '#/components/responses/Problem503'
  /ecoairlines/admin/telemetry/queues:
    get:
      tags: [Administración]
      operationId: getQueues
      summary: "Colas de RabbitMQ"
      description: "Datos de la plataforma de observabilidad (V2.16, D50: Prometheus, Loki, RabbitMQ y Alertmanager, por la composición del ESB). Si una pieza no responde: `503 PROVIDER_UNAVAILABLE`."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueStats'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '503':
          $ref: '#/components/responses/Problem503'
  /ecoairlines/admin/telemetry/alerts:
    get:
      tags: [Administración]
      operationId: getAlerts
      summary: "Alertas activas"
      description: "Datos de la plataforma de observabilidad (V2.16, D50: Prometheus, Loki, RabbitMQ y Alertmanager, por la composición del ESB). Si una pieza no responde: `503 PROVIDER_UNAVAILABLE`."
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '503':
          $ref: '#/components/responses/Problem503'
  /ecoairlines/admin/telemetry/booking-integration:
    get:
      tags: [Administración]
      operationId: getBookingIntegration
      summary: "Estado de la integración con Booking"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingIntegrationStatus'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
components:
  securitySchemes:
    PartnerOAuth2:
      $ref: './vuelos-openapi-v2.yaml#/components/securitySchemes/PartnerOAuth2'
    BearerAuth:
      $ref: './vuelos-openapi-v2.yaml#/components/securitySchemes/BearerAuth'
    PartnerClientBasic:
      $ref: './ms-g-identity.openapi.yaml#/components/securitySchemes/PartnerClientBasic'
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de usuario de la web (`token_use = user`), emitido por MS.G.Identity. Lo reenvía el gateway GraphQL.

  parameters:
    CorrelationId:
      $ref: './vuelos-openapi-v2.yaml#/components/parameters/CorrelationId'
    Sub:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/Sub'
    ClientId:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/ClientId'
    RouteId:
      $ref: './ms-g-schedule.openapi.yaml#/components/parameters/RouteId'
    Registration:
      $ref: './ms-g-schedule.openapi.yaml#/components/parameters/Registration'
    FlightNumber:
      $ref: './vuelos-openapi-v2.yaml#/components/parameters/FlightNumber'
    BookingId:
      $ref: './vuelos-openapi-v2.yaml#/components/parameters/BookingId'
    Date:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    DateFrom:
      name: from
      in: query
      description: Desde (fecha local, inclusive)
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      description: Hasta (fecha local, inclusive)
      schema:
        type: string
        format: date
    UserSearch:
      name: q
      in: query
      description: Busca en el correo y el nombre (sin distinguir mayúsculas)
      schema:
        type: string
        maxLength: 80
    RoleFilter:
      name: role
      in: query
      schema:
        $ref: './ms-g-identity.openapi.yaml#/components/schemas/RoleName'
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: './ms-g-identity.openapi.yaml#/components/schemas/AccountStatus'
    Limit:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/Limit'
    Cursor:
      $ref: './ms-g-identity.openapi.yaml#/components/parameters/Cursor'
    EventType:
      name: type
      in: query
      description: Tipo corto del evento (público o interno), p. ej. `booking.confirmed`
      schema:
        type: string
        maxLength: 60
    CorrelationIdFilter:
      name: correlationId
      in: query
      description: Solo los eventos de ese proceso (X-Correlation-Id)
      schema:
        type: string
        maxLength: 100
    CorrelationIdQuery:
      name: correlationId
      in: path
      required: true
      description: X-Correlation-Id del proceso a rastrear
      schema:
        type: string
        maxLength: 100

  responses:
    Problem400:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem400'
    Problem401:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem401'
    Problem403:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem403'
    Problem404:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem404'
    Problem409:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem409'
    Problem422:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem422'
    Problem429:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem429'
    Problem503:
      $ref: './vuelos-openapi-v2.yaml#/components/responses/Problem503'

  schemas:
    ProblemDetails:
      $ref: './vuelos-openapi-v2.yaml#/components/schemas/ProblemDetails'
    SavePricesRequest:
      type: object
      additionalProperties: false
      description: Un solo «Guardar» de la pantalla «Precios por clase» (D18, D35) → saga "Guardar precios y descuento máximo".
      properties:
        prices:
          $ref: './ms-g-schedule.openapi.yaml#/components/schemas/SaveFarePricesRequest'
        promotion:
          type: object
          additionalProperties: false
          required: [partnerId, agreement]
          properties:
            partnerId:
              type: string
              example: BOOKING_PROTOTIPO
            agreement:
              $ref: './vuelos-openapi-v2.yaml#/components/schemas/ContratoPromocionesRequest'

    PricesView:
      type: object
      additionalProperties: false
      required: [prices, promotions]
      properties:
        prices:
          $ref: './ms-g-schedule.openapi.yaml#/components/schemas/FarePriceTable'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/PartnerPromotionAgreement'

    PartnerPromotionAgreement:
      description: >-
        El acuerdo del contrato v2 más el partner al que pertenece. `proveedor_codigo` NO sirve para eso: es el código de la
        aerolínea (la misma en todos los acuerdos).
      allOf:
        - $ref: './vuelos-openapi-v2.yaml#/components/schemas/ContratoPromocionesResponse'
        - type: object
          required: [partnerId]
          properties:
            partnerId:
              type: string
              example: BOOKING_PROTOTIPO

    DashboardIndicators:
      type: object
      additionalProperties: false
      required: [generatedAt, bookings, users, flightsToday]
      description: Composición "Indicadores" (Bookings + Identity + FlightStatus).
      properties:
        generatedAt:
          type: string
          format: date-time
        bookings:
          $ref: './ms-g-bookings.openapi.yaml#/components/schemas/BookingSummary'
        users:
          $ref: './ms-g-identity.openapi.yaml#/components/schemas/UserSummary'
        flightsToday:
          type: integer

    ServiceHealth:
      type: object
      additionalProperties: false
      required: [service, status, checkedAt]
      properties:
        service:
          type: string
          example: ms-g-offers
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
        latency_ms:
          type: integer
        version:
          type: string
        checkedAt:
          type: string
          format: date-time

    LatencyByService:
      type: object
      additionalProperties: false
      required: [service, p50_ms, p95_ms, p99_ms, requests, errorRate]
      properties:
        service:
          type: string
        p50_ms:
          type: number
        p95_ms:
          type: number
        p99_ms:
          type: number
        requests:
          type: integer
        errorRate:
          type: number
          description: Porcentaje de respuestas 5xx en la ventana

    TraceStep:
      type: object
      additionalProperties: false
      required: [timestamp, service, operation, status, latency_ms]
      description: Una fila de `api_request_logs` (contrato v2 §6) o un span de la traza.
      properties:
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        operation:
          type: string
        status:
          type: string
        latency_ms:
          type: integer
        request_id:
          type: string
        trace_id:
          type: string
        span_id:
          type: string

    BookingTimeline:
      type: object
      additionalProperties: false
      required: [bookingId, sagas, events]
      description: Historial de una reserva (panel O-2, 1.5.0) — sus sagas con los pasos y sus eventos con las entregas a Booking.
      properties:
        bookingId:
          type: string
          format: uuid
        sagas:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sagaId, type, status, correlationId, createdAt, updatedAt, steps]
            properties:
              sagaId:
                type: string
              type:
                type: string
              status:
                type: string
                enum: [RUNNING, COMPLETED, COMPENSATING, COMPENSATED, FAILED]
              correlationId:
                type: string
              parentSagaId:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              errorCode:
                type: string
                nullable: true
              steps:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name, status, at]
                  properties:
                    name:
                      type: string
                    status:
                      type: string
                      enum: [STARTED, DONE, COMPENSATED]
                    at:
                      type: string
                      format: date-time
        events:
          type: array
          items:
            $ref: './ms-g-webhooks.openapi.yaml#/components/schemas/EventHistoryItem'

    CorrelationTrace:
      type: object
      additionalProperties: false
      required: [correlationId, steps]
      description: Todo lo que generó un proceso (contrato v2 §6), en orden.
      properties:
        correlationId:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TraceStep'
        sagas:
          type: array
          items:
            type: object
            properties:
              sagaId:
                type: string
              type:
                type: string
              status:
                type: string
        events:
          $ref: './ms-g-webhooks.openapi.yaml#/components/schemas/EventHistoryPage'

    QueueStats:
      type: object
      additionalProperties: false
      required: [queue, messages, consumers]
      properties:
        queue:
          type: string
        messages:
          type: integer
        consumers:
          type: integer
        deadLetters:
          type: integer

    Alert:
      type: object
      additionalProperties: false
      required: [id, rule, severity, startedAt]
      properties:
        id:
          type: string
        rule:
          type: string
          example: servicio-caido
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
        service:
          type: string
        message:
          type: string
        startedAt:
          type: string
          format: date-time

    BookingIntegrationStatus:
      type: object
      additionalProperties: false
      required: [partnerId, webhooks, stock]
      description: Estado de la integración con Booking para el panel.
      properties:
        partnerId:
          type: string
        lastTokenAt:
          type: string
          format: date-time
          nullable: true
        webhooks:
          $ref: './ms-g-webhooks.openapi.yaml#/components/schemas/DeliveryStats'
        stock:
          type: object
          properties:
            lastPushAt:
              type: string
              format: date-time
              nullable: true
            pendingPushes:
              type: integer
        lastInboundEventAt:
          type: string
          format: date-time
          nullable: true

    AssistanceReadyRequest:
      type: object
      additionalProperties: false
      required: [passengerId, segmentId, ready]
      properties:
        passengerId:
          type: string
        segmentId:
          type: string
        ready:
          type: boolean
