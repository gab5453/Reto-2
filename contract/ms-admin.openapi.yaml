        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/PriceChangePage'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
  /ecoairlines/admin/routes:
    get:
      tags: [Administración]
      operationId: listRoutes
      summary: "Rutas programadas"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRoute'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    post:
      tags: [Administración]
      operationId: createRoute
      summary: "Crear una ruta (saga \"Publicar horario\")"
      security:
        - UserJwt: [ecoairlines:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRouteRequest'
      responses:
        '201':
          description: Ruta creada y publicada
          content:
            application/json:
              schema:
                $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRoute'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
