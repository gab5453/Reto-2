  "flights:read"
  FLIGHTS_READ
  "flights:hold"
  FLIGHTS_HOLD
  "flights:book"
  FLIGHTS_BOOK
  "flights:cancel"
  FLIGHTS_CANCEL
  "flights:webhooks"
  FLIGHTS_WEBHOOKS
  "flights:ops (contrato v2; solo ADMIN)"
  FLIGHTS_OPS
  "flights:admin (contrato v2; solo ADMIN)"
  FLIGHTS_ADMIN
  "ecoairlines:profile (propio)"
  ECOAIRLINES_PROFILE
  "ecoairlines:admin (propio)"
  ECOAIRLINES_ADMIN
}

"Códigos del ProblemDetails del contrato v2 y los propios que la web puede recibir."
enum ProblemCode {
  VALIDATION_FAILED
  SEAT_TAKEN
  AMOUNT_MISMATCH
  BOOKING_NOT_CONFIRMED
  BAGGAGE_LIMIT_EXCEEDED
  CUTOFF_PASSED
  FARE_NOT_CHANGEABLE
  FLIGHT_ALREADY_DEPARTED
  CHANGE_OFFER_EXPIRED
  OFFER_NO_LONGER_AVAILABLE
  QUOTE_EXPIRED
  ALREADY_CANCELLED
  RATE_LIMIT_EXCEEDED
  INFANT_SEAT_NOT_ALLOWED
  PAYMENT_REFERENCE_INVALID
  PAYMENT_NOT_AUTHORIZED
  PNR_CREATION_FAILED
  TICKET_ISSUANCE_FAILED
  TICKET_ALREADY_ISSUED
  CHECK_IN_NOT_AVAILABLE
  CHECK_IN_FAILED
  BOARDING_PASS_NOT_AVAILABLE
  SEAT_CABIN_MISMATCH
  FLIGHT_STATUS_NOT_AVAILABLE
  "Token ausente o inválido (401)."
  UNAUTHENTICATED
  "Scopes insuficientes (403)."
  FORBIDDEN
  "Recurso inexistente o ajeno (404)."
  NOT_FOUND
  "Error no controlado (500)."
  INTERNAL_ERROR
  # --- contrato v2
  IDEMPOTENCY_KEY_REUSED
  PROVIDER_UNAVAILABLE
  HOLD_EXPIRED
  HOLD_ALREADY_CONSUMED
  INFANT_WITHOUT_ADULT
  PASSENGER_COUNT_MISMATCH
  DOCUMENT_EXPIRED
  PASSPORT_REQUIRED_INTERNATIONAL
  BOOKING_NOT_CANCELLABLE
  FLIGHT_CANCELLED
  INVALID_STATUS_TRANSITION
  PROMOTION_DISCOUNT_OUT_OF_RANGE
  # --- propios de EcoAirlines
  INVALID_CREDENTIALS
