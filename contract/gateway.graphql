# ------------------------------------------------------------------------------------- administración: reservas (O-1)
# Solo lectura. Tipos propios (no `Booking`): los sub-recursos de `Booking` validan que el usuario sea el dueño, y el
# administrador ve reservas de cualquier dueño. La asistencia médica no se expone: solo qué pasajeros la tienen.

"Canal de la venta."
enum SalesChannelCode {
  WEB
  BOOKING
}

input AdminBookingFilterInput {
  "PNR, orden de Booking (`partnerOrderId`) o referencia del pago de la reserva, exactos."
  reference: String
  status: BookingStatus
  channel: SalesChannelCode
  createdFrom: Date
  createdTo: Date
}

type AdminBookingSummary {
  bookingId: UUID!
  pnr: String!
  status: BookingStatus!
  channel: SalesChannelCode!
  partnerId: String
  "Orden de Booking."
  partnerOrderId: String
  origin: IataCode
  destination: IataCode
  departureAt: DateTime
  passengerCount: Int!
  grandTotal: MoneyAmount!
  "Suma de los reembolsos (calculados o ejecutados); null si no hay."
  refundTotal: Decimal
  createdAt: DateTime!
}

type AdminBookingPage {
  nextCursor: String
  items: [AdminBookingSummary!]!
}

type AdminSalesChannel {
  partnerId: String
  partnerOrderId: String
  packageId: String
  promotionApplied: Boolean
  discountPercentage: Float
}

"Tarifa comprada por itinerario."
type AdminFare {
  itineraryId: String!
  cabinClass: CabinClass!
  fareBrand: String!
  segmentIds: [String!]!
  isRefundable: Boolean!
  isChangeable: Boolean!
  price: MoneyAmount!
}

"Referencia de pago registrada por la reserva (uso único en todo el sistema)."
type AdminPayment {
  paymentReference: String!
  "BOOKING_PROTOTIPO (cobra Booking) o AIRLINE_DIRECT (Payment API de la web)."
  provider: String!
  "BOOKING, SEATS, BAGGAGE o DATE_CHANGE."
  operation: String!
  amount: MoneyAmount!
  claimedAt: DateTime!
}

type AdminBooking {
  bookingId: UUID!
  pnr: String!
  status: BookingStatus!
  channel: SalesChannelCode!
  "Dueño: el `sub` del usuario web o `partner:<client_id>:<X-User-Id>`."
  ownerId: String!
  "Usuario de Booking (X-User-Id) cuando la vendió un partner."
  partnerUserId: String
  salesChannel: AdminSalesChannel
  paymentReference: String
  grandTotal: MoneyAmount!
  createdAt: DateTime!
  updatedAt: DateTime
  itineraries: [ItineraryOption!]!
  passengers: [Passenger!]!
  fares: [AdminFare!]!
  tickets: [Ticket!]!
  refunds: [Refund!]!
  payments: [AdminPayment!]!
  changes: [BookingChange!]!
  "Pasajeros con asistencia médica (solo el id: es un dato de salud)."
  passengersWithAssistance: [String!]!
  "Historial (O-2): sus sagas con los pasos y sus eventos con las entregas a Booking. → MS.Admin getAdminBookingTimeline"
  timeline: AdminBookingTimeline!
}

"Reporte de ventas (panel O-3). Montos en `currency` con 2 decimales; neto = cobrado − reembolsado."
type SalesReport {
  from: Date!
  to: Date!
  currency: CurrencyCode!
  generatedAt: DateTime!
  totals: SalesTotals!
  byChannel: [SalesByChannel!]!
  byDay: [SalesByDay!]!
  byRoute: [SalesByRoute!]!
  bookingSettlement: BookingSettlement!
}

type SalesTotals {
  bookings: Int!
  cancelled: Int!
  passengers: Int!
  charged: Decimal!
  refunded: Decimal!
  net: Decimal!
}

type SalesByChannel {
  channel: SalesChannelCode!
  bookings: Int!
  charged: Decimal!
  refunded: Decimal!
  net: Decimal!
}

type SalesByDay {
  date: Date!
  channel: SalesChannelCode!
  bookings: Int!
  charged: Decimal!
}

type SalesByRoute {
  origin: IataCode!
  destination: IataCode!
  bookings: Int!
  passengers: Int!
  charged: Decimal!
}

"Liquidación con Booking (canal BOOKING): lo que cobró Booking, lo reembolsado (lo ejecuta Booking) y el neto a favor de EcoAirlines."
type BookingSettlement {
  partnerId: String!
  bookings: Int!
  charged: Decimal!
  refunded: Decimal!
  penalties: Decimal!
  net: Decimal!
  pendingRefunds: PendingRefunds!
  items: [SettlementItem!]!
}

"Reembolsos calculados que todavía ejecuta Booking."
type PendingRefunds {
  count: Int!
  amount: Decimal!
}

type SettlementItem {
  bookingId: UUID!
  pnr: String!
  partnerOrderId: String
  paymentReference: String!
  status: BookingStatus!
  createdAt: DateTime!
  charged: Decimal!
  refunded: Decimal!
  penalty: Decimal!
  net: Decimal!
}

"Historial de una reserva (panel O-2). Nunca trae la entrada ni el resultado de una saga (datos personales y de salud)."
type FlightDelayImpact {
  flightNumber: String!
  date: Date!
  delayMinutes: Int!
  scheduledDepartureAt: DateTime!
  scheduledArrivalAt: DateTime!
  estimatedDepartureAt: DateTime!
  estimatedArrivalAt: DateTime!
  aircraft: DelayImpactAircraft!
  "Siguiente vuelo del mismo avión (ese día o los 2 siguientes); null si no tiene."
  nextFlight: DelayImpactNextFlight
  bookings: Int!
  passengers: Int!
  tightConnections: [TightConnection!]!
}

type DelayImpactAircraft {
  registration: String!
  aircraftType: String!
  turnaroundMinutes: Int!
}

type DelayImpactNextFlight {
  flightNumber: String!
  date: Date!
  origin: String!
  destination: String!
  scheduledDepartureAt: DateTime!
  "Salida vigente (la estimada si ya está retrasado)."
  departureAt: DateTime!
  status: FlightOperationalStatus!
  "Cuándo estaría listo el avión con el retraso."
  readyAt: DateTime!
  conflict: Boolean!
  "Minutos que habría que atrasar este vuelo para que el avión llegue a tiempo."
  suggestedDelayMinutes: Int
}

type TightConnection {
  bookingId: UUID!
  pnr: String!
  channel: String!
  "CONNECTION (escala, mínimo 60 min) o RETURN (vuelta, mínimo 120 min)."
  kind: String!
  nextFlightNumber: String!
  nextDepartureAt: DateTime!
  availableMinutes: Int!
  requiredMinutes: Int!
}

type AdminBookingTimeline {
  sagas: [AdminSaga!]!
  "Eventos de la reserva, del más reciente al más antiguo, con cada entrega a los suscriptores."
  events: [EventHistoryItem!]!
}

type AdminSaga {
  sagaId: String!
  "CREATE_BOOKING, ISSUE_TICKETS, CANCEL_BOOKING, CHECK_IN…"
  type: String!
  "RUNNING, COMPLETED, COMPENSATING, COMPENSATED o FAILED."
  status: String!
  "X-Correlation-Id del proceso: con él se busca la traza en Telemetría."
  correlationId: String!
  parentSagaId: String
  createdAt: DateTime!
  updatedAt: DateTime!
  errorCode: String
  steps: [AdminSagaStep!]!
}

type AdminSagaStep {
  name: String!
  "STARTED, DONE o COMPENSATED."
  status: String!
  at: DateTime!
}

# ------------------------------------------------------------------------------------------ administración: telemetría

type Telemetry {
  "→ MS.Admin getServicesHealth"
  services: [ServiceHealth!]!
  "→ MS.Admin getLatency"
  latency(from: DateTime, to: DateTime): [ServiceLatency!]!
  "Todo lo que generó un proceso, por su X-Correlation-Id. → MS.Admin getCorrelationTrace"
  trace(
    correlationId: String!
    "Rango de búsqueda (O-2). Sin él (T-2), la ventana sale de las sagas y eventos del proceso ±10 min; sin ellos, las últimas 3 h."
    from: DateTime
    to: DateTime
  ): CorrelationTrace
  "Recorrido de un proceso de servicio en servicio, desde Tempo (T-4). Sin trazas: null. → MS.Admin getJourney"
  journey(correlationId: String!, from: DateTime, to: DateTime): Journey
  "Mapa del sistema en vivo: quién llama a quién en los últimos 5 minutos (T-4). → MS.Admin getSystemMap"
  systemMap: SystemMap!
  "→ MS.Admin getQueues"
  queues: [QueueStats!]!
  "→ MS.Admin getAlerts"
  alerts: [Alert!]!
  "→ MS.Admin getBookingIntegration"
  bookingIntegration: BookingIntegration!
}

type ServiceHealth {
  service: String!
  status: ServiceState!
  latencyMs: Int
  version: String
  checkedAt: DateTime!
}

type ServiceLatency {
  service: String!
  p50Ms: Float!
  p95Ms: Float!
  p99Ms: Float!
  requests: Int!
  errorRate: Float!
}

type TraceStep {
  timestamp: DateTime!
  service: String!
  operation: String!
  status: String!
  latencyMs: Int!
  requestId: String
  traceId: String
}

type SagaSummary {
  sagaId: String!
  type: String!
  status: String!
}

type CorrelationTrace {
  correlationId: String!
  "Dónde se buscaron los pasos en Loki (T-2)."
  window: TraceWindow
  steps: [TraceStep!]!
  "Si Loki no respondió a tiempo, por qué faltan los pasos (las sagas y los eventos sí vienen)."
  stepsError: String
  sagas: [SagaSummary!]!
  events: [EventHistoryItem!]!
}

type TraceWindow {
  from: DateTime!
  to: DateTime!
  "RANGE: el rango pedido · RECORDS: sus sagas y eventos ±10 min · DEFAULT: las últimas 3 h"
  source: String!
}

"Recorrido de un proceso (T-4): nodos por capa y saltos en orden de tiempo. Sin datos personales."
type Journey {
  correlationId: String!
  startedAt: DateTime
  durationMs: Float!
  traces: Int!
  window: TraceWindow
  nodes: [JourneyNode!]!
  hops: [JourneyHop!]!
  truncated: Boolean!
}

type JourneyNode {
  id: String!
  "CLIENT, GATEWAY, RESPONSE, ESB, MANAGEMENT o EXTERNAL"
  layer: String!
}

type JourneyHop {
  sequence: Int!
  from: String!
  to: String!
  operation: String!
  "Milisegundos desde el inicio del proceso."
  startMs: Float!
  durationMs: Float!
  "OK o ERROR"
  status: String!
  httpStatus: Int
  traceId: String!
}

type TraceProgress {
  correlationId: String!
  "El recorrido completo hasta ahora."
  journey: Journey!
  "Los saltos que no estaban en el envío anterior (al suscribirse, todos)."
  newHops: [JourneyHop!]!
}

type SystemMap {
  generatedAt: DateTime!
  windowMinutes: Int!
  edges: [SystemMapEdge!]!
}

type SystemMapEdge {
  from: String!
  to: String!
  requestsPerMinute: Float!
  errorsPerMinute: Float!
  p95Ms: Float
}

type QueueStats {
  queue: String!
  messages: Int!
  consumers: Int!
  deadLetters: Int
}

type Alert {
  id: String!
  rule: String!
  severity: AlertSeverity!
  service: String
  message: String
  startedAt: DateTime!
}

type DeliveryStats {
  subscriptions: Int!
  pending: Int!
  retrying: Int!
  exhaustedLast24h: Int!
  deliveredLast24h: Int!
  lastDeliveredAt: DateTime
}

type BookingIntegration {
  partnerId: String!
  lastTokenAt: DateTime
  webhooks: DeliveryStats!
  lastStockPushAt: DateTime
  pendingStockPushes: Int!
  lastInboundEventAt: DateTime
}
