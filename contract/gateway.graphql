}

"Detalle completo de la reserva. Nunca expone el ownerId ni el canal."
type Booking {
  bookingId: UUID!
  pnr: String!
  status: BookingStatus!
  grandTotal: MoneyAmount!
  createdAt: DateTime!
  updatedAt: DateTime
  itineraries: [ItineraryOption!]!
  passengers: [Passenger!]!
  changes: [BookingChange!]!

  # ----- campos resueltos por otras operaciones (sub-recursos REST) -----
  "→ MS.Reservas listTickets"
  tickets: [Ticket!]! @auth(scopes: [FLIGHTS_READ])
  "→ MS.Reservas getTicket (NOT_FOUND si no existe)"
  ticket(ticketId: String!): Ticket! @auth(scopes: [FLIGHTS_READ])
  "→ MS.Postventa getBaggageOptions"
  baggageOptions: [BaggageOption!]! @auth(scopes: [FLIGHTS_READ])
  "→ MS.Postventa getCancellationQuote (genera una cotización nueva en cada resolución)"
  cancellationQuote: CancellationQuote! @auth(scopes: [FLIGHTS_READ])
  "→ MS.Reservas listBoardingPasses"
  boardingPasses: [BoardingPass!]! @auth(scopes: [FLIGHTS_READ])
  "Asistencia médica de los pasajeros (dato de salud). → MS.Reservas listAssistance"
  assistance: [PassengerAssistance!]! @auth(scopes: [FLIGHTS_READ])
  "Reembolsos de la reserva (si se canceló). → MS.Reservas listRefunds"
  refunds: [Refund!]! @auth(scopes: [FLIGHTS_READ])
}

