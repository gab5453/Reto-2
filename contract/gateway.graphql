input RoutePricesInput {
  routeId: String!
  prices: [RoutePriceInput!]! @constraint(maxItems: 4)
}

input PricingInput {
  "Cargo fijo por vuelo (US$)."
  fixedCharge: Float @constraint(minimum: 0, maximum: 500)
  "Precio por km (US$)."
  perKm: Float
  route: RoutePricesInput
}

input FarePriceInput {
  cabinClass: CabinClass!
  fareBrand: String!
  "0,5–10."
  multiplier: Float!
}

input PromotionAgreementInput {
  partnerId: String!
  allowsPromotions: Boolean!
  maxDiscountPercentage: Float!
  enabledDestinations: [String!]
  enabledRoutes: [String!]
  enabledCabins: [CabinClass!]
  validUntil: Date
  comboConditions: String
}

"Un solo «Guardar» de la pantalla: precios que cambian y, opcionalmente, el acuerdo de promociones."
input SavePricesInput {
  prices: [FarePriceInput!]
  "Tarifa base y/o precio exacto de una ruta (P-1)."
  pricing: PricingInput
  promotion: PromotionAgreementInput
}

type PriceChange {
  id: UUID!
  cabinClass: CabinClass!
  fareBrand: String!
  oldMultiplier: Float!
  newMultiplier: Float!
  changedBy: UUID!
  changedAt: DateTime!
}

type PriceChangePage {
  items: [PriceChange!]!
  nextCursor: String
}

# ------------------------------------------------------------------------------------- administración: rutas y flota

enum Weekday {
  SUN
  MON
  TUE
  WED
  THU
  FRI
  SAT
}

input ScheduledRouteInput {
  origin: IataCode!
  destination: IataCode!
  "HH:mm local en el origen."
  outboundDepartureLocal: String! @constraint(pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$")
  "HH:mm local en el destino."
  inboundDepartureLocal: String! @constraint(pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$")
  weekdays: [Weekday!]! @constraint(minItems: 1, maxItems: 7)
  aircraftType: String
  aircraft: [String!]
}

type RouteLeg {
  flightNumber: String!
  origin: IataCode!
  destination: IataCode!
  departureLocal: String!
  arrivalLocal: String!
  arrivalDayOffset: Int!
  "Días en que sale este tramo: la vuelta puede salir días después de la ida."
  weekdays: [Weekday!]
}

type ScheduledRoute {
  routeId: String!
  origin: IataCode!
  destination: IataCode!
  outbound: RouteLeg!
  inbound: RouteLeg!
  weekdays: [Weekday!]!
  aircraftType: String!
  aircraft: [String!]!
  distanceKm: Int!
  durationMinutes: Int!
  "Días entre la salida de la ida y la de la vuelta (0 = el mismo día)."
  returnDelayDays: Int
  "Minutos que el avión pasa en tierra en el destino antes de la vuelta."
  groundMinutes: Int
  "Tiempo mínimo en tierra de su tipo de avión."
  turnaroundMinutes: Int
  source: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Aeropuerto del catálogo (M-1). Su dueño es MS.G.Schedule."
type Airport {
  code: IataCode!
  city: String!
  name: String!
  "ISO 3166-1 alfa-2 (EC, CO, US…)."
  country: String!
  province: String
  lat: Float!
  lon: Float!
  "Desfase fijo respecto de UTC, en minutos (−300 = UTC−5)."
  utcOffsetMinutes: Int!
  "false: no se ofrece para rutas nuevas; las que ya lo usan siguen."
  active: Boolean!
  updatedAt: DateTime
}

input AirportInput {
  city: String!
  name: String!
  country: String!
  province: String
  lat: Float!
  lon: Float!
  utcOffsetMinutes: Int!
  active: Boolean
}

input CreateAirportInput {
  code: IataCode!
  city: String!
  name: String!
  country: String!
  province: String
  lat: Float!
  lon: Float!
  utcOffsetMinutes: Int!
  active: Boolean
}

input AircraftInput {
  aircraftType: String!
  base: IataCode!
}

type Aircraft {
  registration: String!
  aircraftType: String!
  base: IataCode!
  "IN_SERVICE o AVAILABLE."
  status: String!
  routes: [String!]!
  totalSeats: Int!
  source: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CabinSeats {
  cabinClass: CabinClass!
  seats: Int!
}

type AircraftTypeInfo {
  aircraftType: String!
  registrationPrefix: String!
  seats: [CabinSeats!]!
  totalSeats: Int!
  maxRouteKm: Int
  turnaroundMinutes: Int!
  inFleet: Int!
  "Distribución de cada cabina (M-2)."
  cabins: [CabinLayoutInfo!]!
  "NETWORK: de la red base · ADMIN: creado en el panel."
  source: String
}

type CabinLayoutInfo {
  cabinClass: CabinClass!
  seats: Int!
  "Asientos por fila separados por pasillo: 2-2, 1-2-1, 3-3…"
  configuration: String!
  "Letras por fila; - es el pasillo."
  layout: String!
  firstRow: Int!
  lastRow: Int!
  exitRows: [Int!]!
  extraLegroomRows: [Int!]!
}

input CabinSeatsInput {
  seats: Int!
  "Business: 2-2, 1-2-1 o 2-2-2 · Economy: 2-3, 3-3, 2-4-2 o 3-3-3"
  configuration: String!
}

input AircraftTypeInput {
  "HC- + una letra."
  registrationPrefix: String!
  "Alcance en km; null = sin límite."
  maxRouteKm: Int
  turnaroundMinutes: Int!
  business: CabinSeatsInput!
  economy: CabinSeatsInput!
}

input CreateAircraftTypeInput {
  aircraftType: String!
  registrationPrefix: String!
  maxRouteKm: Int
  turnaroundMinutes: Int!
  business: CabinSeatsInput!
  economy: CabinSeatsInput!
}

type FleetFlight {
  flightNumber: String!
  date: Date!
  routeId: String!
  origin: IataCode!
  destination: IataCode!
  departureAt: DateTime!
  arrivalAt: DateTime!
}

type FleetAircraftDay {
  registration: String!
  aircraftType: String!
  base: IataCode!
  flights: [FleetFlight!]!
}

type FleetSchedule {
  date: Date!
  totalFlights: Int!
  aircraft: [FleetAircraftDay!]!
}

