# =====================================================================================================================
# EcoAirlines — esquema GraphQL del gateway (/api/graphql) · contrato v1.1.0 · Reto 2, V2.1 paso 8 (1.1.0: V2.13)
# =====================================================================================================================
#
# QUÉ ES
#   La ÚNICA forma en que la web de EcoAirlines accede al sistema (D23). Booking NO lo usa: entra por /api/v2/vuelos (REST).
#   Parte del SDL de `contract/vuelos-graphql.yaml` (Reto 1, sin modificarlo) y lo EXTIENDE sin romperlo:
#     - lo nuevo del contrato de Vuelos v2 (estado por asiento, emisión de boletos, cambio de asientos, estado de vuelo,
#       operaciones, promociones, ProblemDetails v2, nuevos eventos);
#     - las funciones propias de EcoAirlines (registro, perfil, asistencia médica y el panel de administración).
#   La compatibilidad con la base se comprueba con `findBreakingChanges` de graphql-js (ver CAMBIOS.md, V2.1 paso 8).
#
# CÓMO SE RESUELVE
#   Cada campo llama a UN microservicio de respuesta (REST interno), nunca al ESB ni a un MS.G. En los comentarios
#   la flecha "→ MS.<servicio> <operationId>" indica cuál. Así la web pasa por la misma validación, seguridad y sagas que Booking.
#
# TRANSPORTE
#   POST /api/graphql (también GET para queries). Respuesta HTTP 200 aunque haya errores de negocio en `errors`; 400 solo
#   para documentos inválidos; 401 si falta el token en una operación protegida. Profundidad máxima 10, complejidad máxima
#   1000, introspección solo en desarrollo. Suscripciones: WebSocket `graphql-transport-ws` en /api/graphql.
#   Cabeceras: Authorization (token de usuario), X-Correlation-Id (si no llega, el gateway lo crea; se devuelve siempre),
#   X-Device-Fingerprint (obligatoria en `searchFlights`).
#
# SEGURIDAD (D22, D29, D30)
#   Solo tokens de USUARIO (token_use = user) emitidos por MS.G.Identity; se verifican con su JWKS. Un token de partner o de
#   servicio responde UNAUTHENTICATED. `@auth(scopes)` exige TODOS los scopes indicados; los scopes salen del rol:
#     CLIENTE: flights:read flights:hold flights:book flights:cancel ecoairlines:profile
#     ADMIN:   flights:read flights:webhooks flights:ops flights:admin ecoairlines:admin
#   El dueño es el `sub` del token; ningún input acepta ownerId. Un recurso ajeno responde NOT_FOUND (prevención de IDOR).
#
# IDEMPOTENCIA (contrato v2)
#   Las mutations marcadas con @idempotent exigen `idempotencyKey: UUID!` (se envía como Idempotency-Key al MS de respuesta).
#   Misma clave y mismos argumentos → mismo resultado sin repetir; argumentos distintos → IDEMPOTENCY_KEY_REUSED. 24 h.
#
# ERRORES
#   Cada error replica el ProblemDetails del contrato v2 en `extensions`: code (ProblemCode), status (HTTP equivalente),
#   type, title, detail, instance, correlation_id, timestamp, invalidParams y, en 409/429/503, retryAfter.
#   `message` = title.
#
# PAGOS (D7, D28)
#   La tarjeta va del navegador a la Payment API (que autoriza); aquí solo viaja `paymentReference`. El ESB la captura en la
#   saga. Nunca hay datos de tarjeta en este esquema.
# =====================================================================================================================

# ---------------------------------------------------------------------------------------------------------- directivas

"La operación no requiere autenticación."
directive @public on FIELD_DEFINITION

"Requiere token de usuario válido que contenga TODOS los scopes indicados."
directive @auth(scopes: [Scope!]!) on FIELD_DEFINITION

"La mutation exige el argumento idempotencyKey (UUID) y aplica las reglas de idempotencia."
directive @idempotent on FIELD_DEFINITION

"Restricciones de validación equivalentes a las de OpenAPI."
directive @constraint(
  pattern: String
  minimum: Int
  maximum: Int
  minItems: Int
  maxItems: Int
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

# ------------------------------------------------------------------------------------------------------------- scalars

"UUID (RFC 4122)."
scalar UUID
"Fecha ISO-8601 (YYYY-MM-DD)."
scalar Date
"Fecha y hora ISO-8601 / RFC 3339."
scalar DateTime
"Código IATA de aeropuerto (^[A-Z]{3}$)."
scalar IataCode
"Código de moneda ISO-4217 (^[A-Z]{3}$)."
scalar CurrencyCode
"Monto decimal serializado como String (ej. \"125.40\")."
scalar Decimal
"URL absoluta."
scalar URL
"Objeto JSON libre (solo para los datos de un evento en el historial)."
scalar JSON

# ---------------------------------------------------------------------------------------------------------- root types

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  # ===== Búsqueda y catálogo (base) =====
  "Búsqueda de vuelos (multidestino). Requiere header X-Device-Fingerprint. → MS.Vuelos searchFlights"
  searchFlights(input: SearchFlightsInput!): SearchResult! @public
  "Aeropuertos de la red, para los buscadores (M-1; también los desactivados, con `active = false`). → MS.Vuelos listAirports"
  airports: [Airport!]! @public

  "Mapa de asientos con el estado de cada asiento. → MS.Vuelos getSeatMap"
  seatMap(offerId: String!, segmentId: String!): SeatMap! @public

  # ===== Hold (base) =====
  "Estado de un hold. → MS.Reservas getHold"
  hold(holdId: UUID!): Hold! @auth(scopes: [FLIGHTS_READ])

  # ===== Reservas (base) =====
  "Reservas del usuario (paginado por cursor). → MS.Reservas listBookings"
  bookings(
    filter: BookingFilterInput
    limit: Int = 10 @constraint(minimum: 1, maximum: 50)
    cursor: String
  ): BookingPage! @auth(scopes: [FLIGHTS_READ])

  "Detalle de una reserva propia. → MS.Reservas getBooking"
  booking(bookingId: UUID!): Booking! @auth(scopes: [FLIGHTS_READ])

  # ===== Postventa (base) =====
  "Alternativas para cambio de fecha. → MS.Postventa searchDateChange"
  dateChangeOptions(bookingId: UUID!, input: DateChangeSearchInput!): [DateChangeOption!]!
    @auth(scopes: [FLIGHTS_READ])

  # ===== Estado de vuelos (base) =====
  "Estado operativo de un vuelo en una fecha. → MS.Vuelos getFlightStatus"
  flightStatus(flightNumber: String!, date: Date!): FlightStatus! @public

  # ===== Webhooks (base) =====
  "Suscripciones de webhooks del administrador (con la pista del secreto). → MS.Clientes listOwnWebhooks"
  webhookSubscriptions: [WebhookSubscription!]! @auth(scopes: [FLIGHTS_WEBHOOKS])

  # ===== Cliente (propias) =====
  "Datos del usuario del token (sin llamar a ningún servicio)."
  me: CurrentUser! @auth(scopes: [])

  "Perfil del cliente con su asistencia predeterminada; null si aún no lo guardó. → MS.Clientes getMyProfile"
  myProfile: CustomerProfile @auth(scopes: [ECOAIRLINES_PROFILE])

  # ===== Administración (propias, salvo las marcadas como contrato v2) =====
  "Indicadores del panel. → MS.Admin getIndicators"
  adminIndicators: AdminIndicators! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Usuarios. → MS.Admin listUsers"
  users(filter: UserFilterInput, limit: Int = 20 @constraint(minimum: 1, maximum: 100), cursor: String): UserPage!
    @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin getUser"
  user(sub: UUID!): User! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin listRoles"
  roles: [Role!]! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Partners (sistemas B2B como Booking). → MS.Admin listPartners"
  partners: [Partner!]! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin getPartner"
  partner(clientId: String!): Partner! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Precios por clase y acuerdos de promociones. → MS.Admin getPrices"
  prices: PricesView! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Valores de referencia para «Rellenar» (no guarda nada). → MS.Admin getReferencePrices"
  referencePrices: [FarePrice!]! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin getPriceHistory"
  priceHistory(limit: Int = 20 @constraint(minimum: 1, maximum: 100), cursor: String): PriceChangePage!
    @auth(scopes: [ECOAIRLINES_ADMIN])

  "→ MS.Admin listRoutes"
  routes: [ScheduledRoute!]! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin getRoute"
  route(routeId: String!): ScheduledRoute! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin listAircraftTypes"
  aircraftTypes: [AircraftTypeInfo!]! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin listAircraft"
  fleet: [Aircraft!]! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin getAircraft"
  aircraft(registration: String!): Aircraft! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Rotación de la flota en una fecha. → MS.Admin getFleetSchedule"
  fleetSchedule(date: Date!): FleetSchedule! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Panel de operaciones (contrato v2). → MS.Vuelos listFlightOperations"
  flightOperations(
    date: Date!
    origin: IataCode
    destination: IataCode
    status: FlightOperationalStatus
    limit: Int = 10 @constraint(minimum: 1, maximum: 50)
    cursor: String
  ): FlightOperationsPage! @auth(scopes: [FLIGHTS_OPS])

  "Acuerdo de promociones con un partner (contrato v2). → MS.Admin getPrices (filtrado por partner)"
  promotionAgreement(partnerId: String!): PromotionAgreement @auth(scopes: [ECOAIRLINES_ADMIN])

  "Pasajeros con asistencia de un vuelo (dato de salud). → MS.Admin listFlightAssistance"
  flightAssistance(flightNumber: String!, date: Date!): [FlightAssistanceItem!]! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Qué pasaría con un retraso de un vuelo (solo consulta, R-1). → MS.Admin getFlightDelayImpact"
  flightDelayImpact(flightNumber: String!, date: Date!, delayMinutes: Int! @constraint(minimum: 1, maximum: 1440)): FlightDelayImpact!
    @auth(scopes: [ECOAIRLINES_ADMIN])

  "Historial de eventos y entregas de webhooks; filtros por tipo y correlation ID desde el panel O-4. → MS.Admin listEventHistory"
  eventHistory(
    type: String @constraint(pattern: "^[a-z_.]{1,60}$")
    correlationId: String @constraint(pattern: "^.{1,100}$")
    from: DateTime
    to: DateTime
    limit: Int = 20 @constraint(minimum: 1, maximum: 100), cursor: String):
    EventHistoryPage! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Reservas de todos los canales, solo lectura (panel O-1). → MS.Admin listAdminBookings"
  adminBookings(filter: AdminBookingFilterInput, limit: Int = 20 @constraint(minimum: 1, maximum: 100), cursor: String):
    AdminBookingPage! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Detalle de cualquier reserva, solo lectura (panel O-1). → MS.Admin getAdminBooking"
  adminBooking(bookingId: UUID!): AdminBooking! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Ventas por día, canal y ruta, y la liquidación con Booking (panel O-3; días de Ecuador, máximo un año). → MS.Admin getSalesReport"
  adminSalesReport(from: Date!, to: Date!): SalesReport! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Telemetría del sistema (cada campo llama a su operación de MS.Admin)."
  telemetry: Telemetry! @auth(scopes: [ECOAIRLINES_ADMIN])
}

type Mutation {
  # ===== Autenticación (propias) =====
  "Registro público (siempre CLIENTE). → MS.Clientes register"
  register(input: RegisterInput!): AuthPayload! @public
  "Inicio de sesión. → MS.Clientes login"
  login(input: LoginInput!): AuthPayload! @public

  # ===== Perfil (propias) =====
  "Crear o reemplazar el perfil. → MS.Clientes saveMyProfile"
  saveMyProfile(input: CustomerProfileInput!): CustomerProfile! @auth(scopes: [ECOAIRLINES_PROFILE])

  # ===== Hold (base) =====
  "Bloquea inventario y congela el precio. → MS.Reservas createHold"
  holdInventory(idempotencyKey: UUID!, input: HoldInput!): Hold!
    @auth(scopes: [FLIGHTS_HOLD]) @idempotent

  "Libera un hold anticipadamente. → MS.Reservas releaseHold"
  releaseHold(holdId: UUID!): ReleaseHoldPayload! @auth(scopes: [FLIGHTS_HOLD])

  # ===== Reservas y emisión (base + contrato v2) =====
  """
  Crea la reserva a partir de un hold, con asistencia médica opcional por pasajero. El pago es un `paymentReference`
  autorizado por la Payment API, que el ESB captura. → MS.Reservas createWebBooking
  """
  createBooking(idempotencyKey: UUID!, input: CreateBookingInput!): CreateBookingPayload!
    @auth(scopes: [FLIGHTS_BOOK]) @idempotent

  "Emite (o reintenta emitir) los boletos; idempotente (issued = 0 si ya estaban). → MS.Reservas issueTickets"
  issueTickets(bookingId: UUID!): TicketIssuance! @auth(scopes: [FLIGHTS_BOOK])

  "Cambia los asientos de uno o varios pasajeros (todos o ninguno). → MS.Reservas changeSeats"
  changeSeats(idempotencyKey: UUID!, bookingId: UUID!, input: ChangeSeatsInput!): SeatChangeResult!
    @auth(scopes: [FLIGHTS_BOOK]) @idempotent

  "Pide o cambia la asistencia médica de un pasajero. → MS.Reservas saveAssistance"
  savePassengerAssistance(bookingId: UUID!, passengerId: String!, input: AssistanceInput!): PassengerAssistance!
    @auth(scopes: [FLIGHTS_BOOK])
  "Quita la asistencia de un pasajero. → MS.Reservas deleteAssistance"
  deletePassengerAssistance(bookingId: UUID!, passengerId: String!): Boolean! @auth(scopes: [FLIGHTS_BOOK])

  # ===== Postventa (base) =====
  "Agrega maletas extra. → MS.Postventa addBaggage"
  addBaggage(idempotencyKey: UUID!, bookingId: UUID!, input: AddBaggageInput!): AddBaggagePayload!
    @auth(scopes: [FLIGHTS_BOOK]) @idempotent

  "Confirma un cambio de fecha cotizado (changeOfferId). → MS.Postventa confirmDateChange"
  confirmDateChange(idempotencyKey: UUID!, bookingId: UUID!, input: ConfirmDateChangeInput!): ConfirmDateChangePayload!
    @auth(scopes: [FLIGHTS_BOOK]) @idempotent

  "Cancela la reserva con una cotización vigente (reasonCode CUSTOMER_REQUEST). → MS.Postventa cancelBooking"
  cancelBooking(idempotencyKey: UUID!, bookingId: UUID!, input: CancelBookingInput!): CancelBookingPayload!
    @auth(scopes: [FLIGHTS_CANCEL]) @idempotent

  # ===== Check-in (base) =====
  "Check-in de la reserva (48 h antes; requiere boletos emitidos). → MS.Reservas checkIn"
  checkIn(bookingId: UUID!): CheckInResult! @auth(scopes: [FLIGHTS_BOOK])

  # ===== Webhooks (base) =====
  "→ MS.Clientes createWebhook"
  registerWebhook(input: RegisterWebhookInput!): WebhookSubscription! @auth(scopes: [FLIGHTS_WEBHOOKS])
  "→ MS.Clientes deleteWebhook"
  deleteWebhook(id: UUID!): DeleteWebhookPayload! @auth(scopes: [FLIGHTS_WEBHOOKS])

  # ===== Administración (propias, salvo las marcadas como contrato v2) =====
  "→ MS.Admin createUser"
  createUser(input: CreateUserInput!): User! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin changeUserRole"
  changeUserRole(sub: UUID!, role: RoleName!): User! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin changeUserStatus"
  changeUserStatus(sub: UUID!, input: ChangeStatusInput!): User! @auth(scopes: [ECOAIRLINES_ADMIN])

  "El secreto se devuelve UNA sola vez. → MS.Admin createPartner"
  createPartner(input: CreatePartnerInput!): PartnerWithSecret! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin changePartnerStatus"
  changePartnerStatus(clientId: String!, input: ChangeStatusInput!): Partner! @auth(scopes: [ECOAIRLINES_ADMIN])
  "El secreto nuevo se devuelve UNA sola vez. → MS.Admin rotatePartnerSecret"
  rotatePartnerSecret(clientId: String!): PartnerWithSecret! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Un solo «Guardar»: precios por clase y descuento máximo de promociones (≤ 50 %). → MS.Admin savePrices"
  savePrices(input: SavePricesInput!): PricesView! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Saga \"Publicar horario\". → MS.Admin createRoute"
  createRoute(input: ScheduledRouteInput!): ScheduledRoute! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin updateRoute"
  updateRoute(routeId: String!, input: ScheduledRouteInput!): ScheduledRoute! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin deleteRoute"
  deleteRoute(routeId: String!): Boolean! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Agregar un aeropuerto (M-1; el código no se edita después). → MS.Admin createAirport"
  createAirport(input: CreateAirportInput!): Airport! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Editar un aeropuerto: todo menos el código. En uso, no cambian país, coordenadas ni huso (AIRPORT_IN_USE). → MS.Admin updateAirport"
  updateAirport(code: IataCode!, input: AirportInput!): Airport! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Borrar un aeropuerto sin rutas ni aviones (si los tiene: AIRPORT_IN_USE, se desactiva). → MS.Admin deleteAirport"
  deleteAirport(code: IataCode!): Boolean! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Agregar un tipo de avión (M-2): Business y Economy siempre (D-T8). → MS.Admin createAircraftType"
  createAircraftType(input: CreateAircraftTypeInput!): AircraftTypeInfo! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Editar un tipo sin aviones ni rutas (con aviones: AIRCRAFT_TYPE_IN_USE, D-T7). → MS.Admin updateAircraftType"
  updateAircraftType(aircraftType: String!, input: AircraftTypeInput!): AircraftTypeInfo! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Borrar un tipo sin aviones ni rutas. → MS.Admin deleteAircraftType"
  deleteAircraftType(aircraftType: String!): Boolean! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin createAircraft"
  createAircraft(input: AircraftInput!): Aircraft! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin updateAircraft"
  updateAircraftBase(registration: String!, base: IataCode!): Aircraft! @auth(scopes: [ECOAIRLINES_ADMIN])
  "→ MS.Admin deleteAircraft"
  deleteAircraft(registration: String!): Boolean! @auth(scopes: [ECOAIRLINES_ADMIN])

  "Cambia el estado de un vuelo (contrato v2; saga con reembolsos si se cancela). → MS.Vuelos updateFlightStatus"
  updateFlightStatus(flightNumber: String!, input: FlightStatusUpdateInput!): FlightStatusUpdate!
    @auth(scopes: [FLIGHTS_OPS])

  """
  Cancela una reserva como administrador, aunque tenga check-in (excepción a D2, con motivo escrito). Reembolso completo sin
  penalidad y asientos liberados. → MS.Admin adminCancelBooking
  """
  adminCancelBooking(bookingId: UUID!, reason: String!): Boolean! @auth(scopes: [ECOAIRLINES_ADMIN])
  "Marca que el aeropuerto confirmó la asistencia de un pasajero. → MS.Admin markAssistanceReady"
  markAssistanceReady(bookingId: UUID!, input: AssistanceReadyInput!): Boolean! @auth(scopes: [ECOAIRLINES_ADMIN])
}

type Subscription {
  "Eventos de las reservas del usuario (equivalente en tiempo real a los webhooks; filtrado por dueño)."
  bookingEvents(events: [WebhookEventType!]): WebhookEvent! @auth(scopes: [FLIGHTS_READ])
  """
  T-5: el recorrido de un proceso mientras ocurre. Al suscribirse llega lo que ya hay; después, cada vez que Tempo tiene pasos nuevos
  (~3–4 s después de ocurrir), el recorrido completo y cuáles son los nuevos. El gateway consulta cada 2 s solo mientras hay
  alguien suscrito, una sola vez para todos los suscriptores del mismo proceso.
  """
  traceProgress(correlationId: String!): TraceProgress! @auth(scopes: [ECOAIRLINES_ADMIN])
  "T-5: el mapa del sistema cada vez que cambia (se consulta cada 10 s solo mientras hay alguien suscrito)."
  liveSystemMap: SystemMap! @auth(scopes: [ECOAIRLINES_ADMIN])
}

