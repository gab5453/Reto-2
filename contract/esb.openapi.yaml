  /sagas:
    get:
      tags: [Orquestador]
      operationId: listSagas
      summary: Sagas (panel de administración)
      parameters:
        - $ref: '#/components/parameters/ActorIdRequired'
        - name: status
          in: query
          schema:
            type: string
            enum: [RUNNING, COMPLETED, COMPENSATING, COMPENSATED, FAILED]
        - name: type
          in: query
          schema:
            type: string
        - name: parentSagaId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: De la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SagaView'
        '400':
          $ref: '#/components/responses/Problem'

  /composition/bookings/{bookingId}/cancellation-quote:
    get:
      tags: [Composición]
      operationId: composeCancellationQuote
      summary: Cotización de cancelación (Bookings + PostSale; válida 15 min)
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/CancellationQuoteResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /composition/bookings/{bookingId}/baggage-options:
    get:
      tags: [Composición]
      operationId: composeBaggageOptions
      summary: Opciones de maletas extra (Bookings + PostSale)
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Por pasajero e itinerario no volado
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/BaggageOptionsResponse'
        '404':
          $ref: '#/components/responses/Problem'

  /composition/bookings/{bookingId}/boarding-passes:
    get:
      tags: [Composición]
      operationId: composeBoardingPasses
      summary: Pases de abordar con la puerta vigente (Bookings + CheckIn + FlightStatus)
      description: |
        Bookings comprueba el dueño (`404` si la reserva es de otro: CheckIn no conoce dueños); CheckIn da los pases (`409
        BOARDING_PASS_NOT_AVAILABLE` sin check-in); FlightStatus, la puerta de cada vuelo, que puede cambiar después del check-in.
        Si FlightStatus no responde, el pase sale con la puerta que tenía. Reemplaza la ruta directa a CheckIn del enrutador (V2.12).
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pases de la reserva
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/BoardingPassListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /composition/bookings/{bookingId}/date-change/search:
    post:
      tags: [Composición]
      operationId: composeDateChangeSearch
      summary: Alternativas de cambio de fecha (Bookings + Offers + PostSale; el ESB recuerda cada oferta)
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './vuelos-openapi-v2.yaml#/components/schemas/DateChangeSearchRequest'
      responses:
        '200':
          description: Ofertas de cambio (vencen a los 15 min)
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/DateChangeSearchResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    ServiceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de servicio (`token_use = service`, scope `ecoairlines:esb` de un MS de respuesta, D44, o `ecoairlines:internal`), verificado con la JWKS de MS.G.Identity.

  parameters:
    OwnerId:
      name: X-Owner-Id
      in: header
      required: false
      description: |
        Dueño (D29), calculado del token por el MS de respuesta: `sub` del usuario web, `partner:<clientId>:<X-User-Id>` (reservas
        y holds) o `partner:<clientId>` (lo que es del partner completo: sus suscripciones de webhooks). Se reenvía sin cambios.
      schema:
        type: string
        maxLength: 200
        pattern: ^([0-9a-f-]{36}|partner:[A-Z][A-Z0-9_]{2,39}(:[\x21-\x7E]{1,120})?)$
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      description: '`sub` del administrador (auditoría y datos de cualquier dueño). Se reenvía al MS.G sin cambios.'
      schema:
        type: string
        format: uuid
    OwnerIdRequired:
      name: X-Owner-Id
      in: header
      required: true
      description: Dueño de la reserva (D29), calculado del token por el MS de respuesta.
      schema:
        type: string
        maxLength: 200
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorIdRequired:
      name: X-Actor-Id
      in: header
      required: true
      description: '`sub` del administrador.'
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador del proceso de negocio (D31). Se propaga sin cambios; si no llega, el ESB crea uno.
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID; lo resuelve el ESB (D6) y no se reenvía al MS.G.
      schema:
        type: string
        format: uuid

  headers:
    Idempotent-Replayed:
      description: '`true` si es la respuesta guardada de un reintento con la misma Idempotency-Key.'
      schema:
        type: string
        enum: ['true']
    X-Correlation-Id:
      description: El mismo recibido (o el creado por el ESB).
      schema:
        type: string

  requestBodies:
    Routed:
      required: false
      description: El cuerpo del contrato del MS.G para esa ruta, tal cual (JSON o, en `/oauth2/token`, formulario).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true

  responses:
    SagaBooking:
      description: La reserva (`BookingView` de ms-g-bookings) — `201` CONFIRMED, `202` TICKET_ISSUING. `X-Saga-Id` es la saga.
      headers:
        X-Saga-Id:
          schema:
            type: string
            format: uuid
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
              - $ref: './ms-g-bookings.openapi.yaml#/components/schemas/BookingView'
              - $ref: '#/components/schemas/SagaPending'
    SagaPending:
      description: La saga no terminó en el plazo (o espera un reintento); sigue en segundo plano
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SagaPending'
    TimetablePublished:
      description: Ruta guardada y horario publicado en Offers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TimetablePublished'
    Routed:
      description: |
        La respuesta del MS.G (status, cuerpo y su schema según `ms-g-<servicio>.openapi.yaml`). Además, del ESB: `404`/`405` si la
        ruta no es del enrutador, `409 IDEMPOTENCY_KEY_REUSED` y `503 PROVIDER_UNAVAILABLE`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        Idempotent-Replayed:
          $ref: '#/components/headers/Idempotent-Replayed'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem:
      description: Error (ProblemDetails v2)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Health:
      type: object
      required: [status, service, version, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: esb
        version:
          type: string
        uptime_seconds:
          type: integer
        dependencies:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [up, down, memory]
              latency_ms:
                type: integer

    ProblemDetails:
      type: object
      additionalProperties: false
      description: |
        ProblemDetails del contrato v2 (RFC 7807). `code` es el del contrato o el del MS.G que respondió (sin cambios); propios del
        ESB: `PROVIDER_UNAVAILABLE` (503), `IDEMPOTENCY_KEY_REUSED` (409), `METHOD_NOT_ALLOWED` (405), `NOT_FOUND` (404),
        `VALIDATION_FAILED` (400), `UNAUTHORIZED` (401), `FORBIDDEN` (403).
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        correlation_id:
          type: string
        timestamp:
          type: string
          format: date-time
        invalidParams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string

    BookingInboundEvent:
      description: CloudEvent de Booking (contrato v2 §8)
      oneOf:
        - $ref: './vuelos-openapi-v2.yaml#/components/schemas/EventPaymentConfirmed'
        - $ref: './vuelos-openapi-v2.yaml#/components/schemas/EventPackageCancelled'

    CreateBookingSagaRequest:
      type: object
      additionalProperties: false
      description: '`BookingRequest` del contrato v2 más la asistencia opcional (solo la web). Se declara completo: un `allOf` con `additionalProperties: false` rechazaría `assistance`.'
      required: [holdId, passengers, payment]
      properties:
        holdId:
          type: string
          format: uuid
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: './vuelos-openapi-v2.yaml#/components/schemas/PassengerItem'
        payment:
          $ref: './vuelos-openapi-v2.yaml#/components/schemas/PaymentReference'
        salesChannel:
          $ref: './vuelos-openapi-v2.yaml#/components/schemas/SalesChannel'
        assistance:
          type: array
          description: Dato de salud (nunca en logs ni en eventos externos)
          # `AssistanceRequest` + `passengerId`, declarado completo: un `allOf` con su `additionalProperties: false` rechazaría
          # `passengerId` (corregido en 1.2.0, V2.12).
          items:
            type: object
            additionalProperties: false
            required: [passengerId, type]
            properties:
              passengerId:
                type: string
                maxLength: 20
              type:
                $ref: './ms-g-bookings.openapi.yaml#/components/schemas/AssistanceType'
              needsCompanion:
                type: boolean
                default: false
              notes:
                type: string
                maxLength: 200

    SagaPending:
      type: object
      required: [sagaId, status]
      properties:
        sagaId:
          type: string
          format: uuid
        status:
          type: string
          enum: [RUNNING, PENDING]
        type:
          type: string
        bookingId:
          type: string
          format: uuid

    CancellationPending:
      type: object
      additionalProperties: false
      required: [bookingId, status, sagaId]
      properties:
        bookingId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CANCELLATION_PENDING]
        sagaId:
          type: string
          format: uuid

    SagaView:
      type: object
      additionalProperties: false
      required: [sagaId, type, status, steps, correlationId, attempts, createdAt, updatedAt]
      properties:
        sagaId:
          type: string
          format: uuid
        type:
          type: string
          enum: [CREATE_BOOKING, ISSUE_TICKETS, PAYMENT_FAILED, CHANGE_SEATS, CHECK_IN, CANCEL_BOOKING, CHANGE_DATE, ADD_BAGGAGE, ASSISTANCE_READY, UPDATE_FLIGHT_STATUS, SAVE_PRICES, PUBLISH_TIMETABLE]
        status:
          type: string
          enum: [RUNNING, COMPLETED, COMPENSATING, COMPENSATED, FAILED]
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status, at]
            properties:
              name:
                type: string
              status:
                type: string
                enum: [STARTED, DONE, COMPENSATED]
              at:
                type: string
                format: date-time
        result:
          type: object
          nullable: true
          additionalProperties: true
          description: Solo si está COMPLETED
        error:
          type: object
          nullable: true
          additionalProperties: true
        correlationId:
          type: string
        parentSagaId:
          type: string
          format: uuid
          nullable: true
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FlightStatusSagaResult:
      type: object
      required: [previousStatus, flight, affectedBookings, eventId, changeId]
      description: '`FlightStatusUpdateResponse` del contrato v2 más el `changeId` y el resultado de cada cancelación.'
      properties:
        previousStatus:
          $ref: './vuelos-openapi-v2.yaml#/components/schemas/FlightOperationalStatus'
        flight:
          $ref: './vuelos-openapi-v2.yaml#/components/schemas/FlightStatus'
        affectedBookings:
          type: integer
        eventId:
          type: string
        changeId:
          type: string
          format: uuid
        cancellations:
          type: array
          items:
            type: object
            properties:
              bookingId:
                type: string
                format: uuid
              pnr:
                type: string
              status:
                type: string
                enum: [CANCELLED, NOT_CANCELLED]
              error:
                type: string

    TimetablePublished:
      type: object
      required: [flights]
      properties:
        route:
          $ref: './ms-g-schedule.openapi.yaml#/components/schemas/ScheduledRoute'
        deletedRouteId:
          type: string
        published:
          type: object
          additionalProperties: true
          description: '`PublishResult` de ms-g-offers.proto'
        flights:
          type: integer
          description: Vuelos publicados en Offers

    InboundAccepted:
      type: object
      additionalProperties: false
      required: [accepted, id, duplicate]
      properties:
        accepted:
          type: boolean
          enum: [true]
        id:
          type: string
          description: '`id` del CloudEvent'
        duplicate:
          type: boolean
          description: '`true` si ese `id` ya había llegado: no se vuelve a procesar'

    InboundStatus:
      type: string
      enum: [PENDING, PROCESSING, RETRY, PROCESSED, REJECTED, WAITING_SAGA]

    InboundEvent:
      type: object
      additionalProperties: false
      required: [id, type, source, bookingId, correlationId, channel, event, status, attempts, nextAttemptAt, outcome, receivedAt, processedAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [ec.edu.epn.booking.pagos.payment.confirmed, ec.edu.epn.booking.pagos.payment.failed, ec.edu.epn.booking.paquetes.package.cancelled]
        source:
          type: string
        bookingId:
          type: string
          format: uuid
          nullable: true
        correlationId:
          type: string
        channel:
          type: string
          enum: [WEBHOOK, AMQP]
        event:
          type: object
          additionalProperties: true
          description: El CloudEvent tal como llegó
        status:
          $ref: '#/components/schemas/InboundStatus'
        attempts:
          type: integer
          minimum: 0
        nextAttemptAt:
          type: string
          format: date-time
        outcome:
          type: object
          nullable: true
          additionalProperties: true
          description: Resultado (PROCESSED), ProblemDetails del rechazo (REJECTED) o del último intento (RETRY)
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true

    InboundEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboundEvent'
