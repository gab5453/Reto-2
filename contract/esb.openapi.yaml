        `flight.status_changed` (+ `flight.cancelled`). `affectedBookingIds` del evento solo lleva las reservas de Booking (D40).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './vuelos-openapi-v2.yaml#/components/schemas/FlightStatusUpdateRequest'
      responses:
