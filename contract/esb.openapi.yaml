  x-esb-offers-routes: [Search, GetSeatMap, CreateHold, GetHold, ReleaseHold]
servers:
  - url: http://esb:8080
    description: Red interna (lo llaman los MS de respuesta; el gateway solo publica la entrada de eventos de Booking)
  - url: http://localhost:4000
    description: Desarrollo local
security:
  - ServiceToken: []
tags:
  - name: Enrutador
    description: Una petición, un MS.G (REST, o gRPC de Offers por HTTP)
  - name: Composición
    description: Varios MS.G en paralelo, solo lectura
  - name: Orquestador
    description: Las sagas con compensación (V2.10)
  - name: Entrada de eventos de Booking
    description: payment.confirmed, payment.failed y package.cancelled (BKG-01)
  - name: Operación
    description: Salud del propio ESB
paths:
  /health:
    get:
      tags: [Operación]
      operationId: getHealth
      summary: Salud del ESB (su base y su bus); la del nodo completo es `/composition/health`
      security: []
      responses:
        '200':
          description: Todo arriba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Alguna dependencia caída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /router/offers/{rpc}:
    parameters:
      - name: rpc
        in: path
        required: true
        schema:
          type: string
          enum: [Search, GetSeatMap, CreateHold, GetHold, ReleaseHold]
      - $ref: '#/components/parameters/OwnerId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Enrutador]
      operationId: routeOffersRpc
      summary: Un RPC de MS.G.Offers por HTTP (mapeo JSON de proto3)
      description: |
        El cuerpo es el mensaje `<Rpc>Request` de `ms-g-offers.proto` en JSON (camelCase); la respuesta, el `<Rpc>Response`. El
        dueño del hold va en `X-Owner-Id` (metadata `x-owner-id`). Un error de Offers vuelve con su status y su `code`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Mensaje `<Rpc>Request` de ms-g-offers.proto (mapeo JSON de proto3)
              additionalProperties: true
      responses:
        '200':
          description: Mensaje `<Rpc>Response` de ms-g-offers.proto
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /router/{service}/{route}:
    parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
          enum: [identity, customers, webhooks, schedule, flight-status, bookings, check-in]
      - name: route
        in: path
        required: true
        description: Ruta del MS.G (puede tener varios segmentos y query), una de `x-esb-routes`
        schema:
          type: string
        example: bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7
      - $ref: '#/components/parameters/OwnerId'
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [Enrutador]
      operationId: routeGet
      summary: Lectura en un MS.G REST
      responses:
        default:
          $ref: '#/components/responses/Routed'
    post:
      tags: [Enrutador]
      operationId: routePost
      summary: Escritura en un MS.G REST (idempotente con Idempotency-Key)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Routed'
      responses:
        default:
          $ref: '#/components/responses/Routed'
    put:
      tags: [Enrutador]
      operationId: routePut
      summary: Escritura en un MS.G REST (idempotente con Idempotency-Key)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Routed'
      responses:
        default:
          $ref: '#/components/responses/Routed'
    delete:
      tags: [Enrutador]
      operationId: routeDelete
      summary: Borrado en un MS.G REST (idempotente con Idempotency-Key)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        default:
          $ref: '#/components/responses/Routed'

  /composition/health:
    get:
      tags: [Composición]
      operationId: composeNodeHealth
      summary: Health del nodo de vuelos (contrato v2 `getHealth`), desde caché
      description: |
        Se calcula en segundo plano cada 5 s: `/health` de los 9 MS.G (y de la Payment API si está configurada), base y bus del
        ESB, holds activos (Offers) y vuelos de hoy (FlightStatus). `DOWN` (503) si cae la base del ESB, Identity, Offers o
        Bookings (sin ellos no se vende a Booking); `DEGRADED` si cae cualquier otra pieza.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: HEALTHY o DEGRADED
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/VuelosHealthResponse'
        '503':
          description: DOWN
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/VuelosHealthResponse'

  /composition/services-health:
    get:
      tags: [Composición]
      operationId: composeServicesHealth
      summary: Salud de cada servicio para el panel (misma caché)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Un elemento por dependencia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ms-admin.openapi.yaml#/components/schemas/ServiceHealth'

  /composition/flight-operations:
    get:
      tags: [Composición]
      operationId: composeFlightOperations
      summary: Panel de operaciones por vuelo y cabina (contrato v2 `listFlightOperations`) — Offers + FlightStatus
      description: |
        Asientos por estado y cabina, ocupación, holds activos y su próximo vencimiento (Offers `GetOccupancy`), estado operativo y
        check-in abierto (FlightStatus; abre 48 h antes y cierra a la salida) y alertas: `CANCELLED` (crítica), `DELAYED`,
        `CHECKIN_OPEN`, `OVERBOOKING_RISK` (ocupación ≥ 95 %) y `LOW_AVAILABILITY` (menos de 10 asientos libres en una cabina).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: origin
          in: query
          schema:
            type: string
            pattern: ^[A-Z]{3}$
        - name: destination
          in: query
          schema:
            type: string
            pattern: ^[A-Z]{3}$
        - name: status
          in: query
          schema:
            $ref: './vuelos-openapi-v2.yaml#/components/schemas/FlightOperationalStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Vuelos de la fecha
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/FlightOperationsResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /composition/indicators:
    get:
      tags: [Composición]
      operationId: composeIndicators
      summary: Indicadores del panel — Bookings + Identity + FlightStatus
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorIdRequired'
        - name: from
          in: query
          schema:
            type: string
            format: date
