openapi: 3.0.3
info:
  title: ESB — enrutador, composición, transversal y entrada de eventos de Booking (interno)
  version: 1.3.0
  license:
    name: Uso académico — Integración de Sistemas (sin licencia de distribución)
  description: |
    **ESB** de EcoAirlines (Reto 2, PLAN.md §4.2). Concentra la lógica de integración: los MS de respuesta (MS.Vuelos,
    MS.Reservas, MS.Postventa, MS.Clientes, MS.Admin) **solo** hablan con el ESB, y el ESB habla con los 9 MS.G por REST, gRPC
    (MS.G.Offers) y SOAP (MS.G.PostSale), y con la Payment API (canal web).

    | Pieza | Qué hace | Fase |
    |-------|----------|------|
    | **Enrutador** | Una petición, un MS.G, sin coordinación (`/router/...`) | V2.9 |
    | **Composición** | Varios MS.G en paralelo, solo lectura (`/composition/...`) | V2.9 |
    | **Entrada de eventos de Booking** | `payment.confirmed`, `payment.failed`, `package.cancelled` (BKG-01) | V2.9 |
    | **Orquestador** | Las 11 sagas con compensación (`/sagas/...`) y "Marcar asistencia lista" | V2.10 |

    ### Orquestador (V2.10)
    Cada saga recibe el cuerpo del contrato v2 (ya validado por el MS de respuesta) y devuelve la forma interna de los MS.G (el
    MS de respuesta arma la pública, D43). Su estado y sus pasos hechos quedan en `saga_log`:
    - Si un paso falla **antes del punto sin retorno**, se compensan los pasos hechos en orden inverso y vuelve el error del paso
      (ya compensado). La compensación de cada paso se registra antes de ejecutarlo: si el paso falló por plazo vencido (no se
      sabe si se hizo), también se compensa; por eso todas las compensaciones son seguras aunque el paso no haya ocurrido.
    - **Después del punto sin retorno** (p. ej. "Cancelar" después de PostSale) un MS.G caído no compensa: la saga se reintenta
      hasta terminar (2 s, 10 s, 30 s, 2 min, 10 min, 30 min). Un error de negocio ahí deja la saga `FAILED` (revisión).
    - **Plazo de 5 s de Booking:** si la saga no termina en 4,5 s se responde `202` con su estado y sigue en segundo plano. Si la
      réplica se cae, el trabajador de recuperación la retoma con el mismo `sagaId`: los pasos hechos no se repiten.
    - Los eventos de la saga se publican en su último paso, con un `id` derivado del `sagaId` (un reintento no duplica el evento
      en Webhooks).
    | Saga | Operación | Pasos (compensación) |
    |------|-----------|----------------------|
    | Crear reserva | `POST /sagas/bookings` | Offers valida el hold → Bookings valida → pago* (liberar o reembolsar) → Offers consume (liberar) → Bookings crea (`FAILED` + `booking.failed`) → Emitir boletos |
    | Emitir boletos | `POST /sagas/bookings/{id}/tickets` y `payment.confirmed` | Offers `BOOKED → TICKETED` (volver a `BOOKED`) → Bookings emite; `booking.ticket_failed` si falla |
    | Pago fallido | `payment.failed` | Offers libera → Bookings `FAILED` (no se deshace) |
    | Cambiar asientos | `PUT /sagas/bookings/{id}/seats` | Offers ocupa los nuevos (volver a los anteriores) → pago* → Bookings |
    | Check-in | `POST /sagas/bookings/{id}/check-in` | FlightStatus (ventana, no cancelado) → Offers asiento automático y `CHECKED_IN` (volver a `TICKETED`) → CheckIn (deshacer) → Bookings |
    | Cancelar | `POST /sagas/bookings/{id}/cancel` y `package.cancelled` | PostSale (cotización o compensación) → **sin retorno** → Offers libera → reembolso → Bookings |
    | Cambiar fecha | `POST /sagas/bookings/{id}/date-change` | PostSale consume la oferta (liberarla) → pago* → Offers cupos nuevos (liberarlos) → Bookings → Offers libera los viejos |
    | Agregar maletas | `POST /sagas/bookings/{id}/baggage` | PostSale valida → pago* → Bookings |
    | Cambiar estado de vuelo | `PATCH /sagas/flights/{n}/status` | FlightStatus (revertir) → Bookings afectadas → `CANCELLED`: Offers cierra la venta (reabrir) → **sin retorno** → Cancelar cada reserva; `DEPARTED`: `BOARDED` |
    | Guardar precios y descuento | `PUT /sagas/fare-prices`, `PUT /sagas/promotion-agreements/{id}` | Schedule guarda (valores anteriores) → Offers `PublishFarePrices` → `pricing.changed` |
    | Publicar horario | `POST/PUT/DELETE /sagas/routes…`, `POST /sagas/timetable/publish` | Offers cupos vendidos → Schedule guarda (restaurar la ruta) → Offers `PublishTimetable` → `schedule.published` |
    | Marcar asistencia lista | `PUT /sagas/bookings/{id}/assistance-ready` | CheckIn (desmarcar) → Bookings |

    ### Seguridad
    - Toda operación (salvo `/health` y la entrada de eventos por webhook) exige un **token de servicio**
      (`token_use = service`) verificado con la JWKS de MS.G.Identity: el de cada MS de respuesta (cliente interno propio,
      scope `ecoairlines:esb`, D44) o el del propio ESB (`ecoairlines:internal`). Un token de usuario o de partner → `403`; sin
      token → `401`. Los MS.G rechazan `ecoairlines:esb`: un MS de respuesta no puede saltarse el ESB.
    - **El dueño nunca sale del cuerpo**: el MS de respuesta lo calcula del token y lo envía en `X-Owner-Id` (`sub` del usuario
      web o `partner:<clientId>:<X-User-Id>`, D29) o `X-Actor-Id` (`sub` del administrador). El ESB lo reenvía sin cambios.
    - La entrada de eventos por webhook no lleva token: se autentica con `X-Webhook-Signature` (HMAC-SHA256 del cuerpo exacto
      con el secreto compartido con Booking).

    ### Transversal
    - **Correlation ID (D31):** `X-Correlation-Id` se propaga SIN cambios a cada MS.G (HTTP, metadata gRPC `x-correlation-id`,
      cabecera SOAP `CorrelationId`); cada salto lleva un `X-Request-Id` nuevo. Se devuelve en toda respuesta.
    - **Idempotencia (D6):** en las escrituras del enrutador (`POST`, `PUT`, `PATCH`, `DELETE`; en Offers, `CreateHold` y
      `ReleaseHold`), `Idempotency-Key` (UUID) se resuelve aquí y **no** se reenvía: misma clave y mismo cuerpo → la respuesta
      guardada con `Idempotent-Replayed: true`; otro cuerpo → `409 IDEMPOTENCY_KEY_REUSED`; se guarda 24 h por dueño. Un `5xx`
      no se guarda (el reintento vuelve a intentarlo).
    - **Plazos:** cada llamada a un MS.G tiene un plazo de 4 s (menor que el timeout de 5 s de Booking) y un **circuit breaker**
      por MS.G (5 fallas seguidas → abierto 10 s). Un MS.G que no responde → `503 PROVIDER_UNAVAILABLE` con `Retry-After`.
    - **Errores:** los MS.G REST ya responden `ProblemDetails` v2 y el enrutador los devuelve tal cual; los de gRPC (trailer
      `x-problem-details-bin`) y SOAP (`PostSaleFault`) se traducen sin perder el `code`.

    ### Enrutador
    `/router/<servicio><ruta del MS.G>` reenvía la petición (cuerpo, query y `Content-Type`) al MS.G y devuelve su status, su
    cuerpo y sus cabeceras `Content-Type`, `Location`, `Retry-After`, `WWW-Authenticate` y `Cache-Control`. Solo existen las
    47 rutas de `x-esb-routes` (copiadas de la tabla del Enrutador del plan, idénticas al contrato de cada MS.G); otra ruta del
    mismo servicio → `404` (o `405` con otro método): lo que coordina varios MS.G es del orquestador o de la composición.
    `POST /oauth2/token` se reenvía **sin** el token del ESB: el partner se autentica con su `client_id` y `client_secret` en el
    cuerpo (`client_secret_post`), que el MS de respuesta arma a partir de su `Authorization: Basic`.

    MS.G.Offers (gRPC) se expone como `POST /router/offers/<Rpc>` con el **mapeo JSON de proto3** (`ms-g-offers.proto`: campos en
    camelCase, enums por su nombre, p. ej. `CABIN_CLASS_ECONOMY`). Solo los RPC de `x-esb-offers-routes`.

    ### Entrada de eventos de Booking (D34; BKG-01)
    Por **webhook** (`POST /integraciones/booking/eventos`, que el gateway publica como `/api/integraciones/booking/eventos`) o por
    **AMQP** (exchange `booking.events`, cola `ecoairlines.esb.booking-inbound`, routing keys `pagos.payment.confirmed`,
    `pagos.payment.failed` y `paquetes.package.cancelled`). Cada CloudEvent se guarda por su `id` en `inbound_events`: uno
    repetido responde `202` con `duplicate: true` y **no** se procesa otra vez. Se procesa en segundo plano con el mismo
    `correlationid`:
    | Evento | Qué hace el ESB |
    |--------|-----------------|
    | `payment.confirmed` | "Emitir boletos": la reserva debe ser del canal Booking y la referencia, la de la reserva (y el monto, si llega). Offers `BOOKED → TICKETED`, Bookings emite (`issued: 0` si ya estaban) y se publica `booking.ticket_issued` |
    | `payment.failed` | "Pago fallido": Offers libera los asientos, Bookings marca `FAILED` y se publica `booking.failed` (si ya estaba `FAILED`, nada) |
    | `package.cancelled` | Saga "Cancelar" con `SAGA_COMPENSATION` (100 % sin penalidad, D42) si el combo es el de la reserva |
    Un error de negocio deja el evento `REJECTED` (con su ProblemDetails); si un MS.G no responde, `RETRY` a los 5 s, 30 s, 2 min,
    10 min, 30 min y luego cada hora: nunca se descarta.

    **Base de datos propia:** `esb` (tablas `idempotency_claims`, `inbound_events`, `saga_log` y `change_offers`).
