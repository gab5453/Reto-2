  # ============================================================================================ Orquestador (V2.10)
  /sagas/bookings:
    post:
      tags: [Orquestador]
      operationId: sagaCreateBooking
      summary: Saga "Crear reserva" (+ asistencia opcional)
      description: |
        Offers valida el hold y el descuento → Bookings valida los pasajeros → pago* → Offers consume el hold (asientos `BOOKED`)
        → Bookings crea la reserva → "Emitir boletos" → `booking.confirmed` y `booking.ticket_issued`. El `bookingId` lo genera el
        ESB. `201` con la reserva `CONFIRMED`; si la emisión no termina en el plazo, `202` con la reserva `TICKET_ISSUING` (la saga
        sigue). Si un paso falla antes de emitir, se compensa todo (LIFO) y se publica `booking.failed`.
      parameters:
        - $ref: '#/components/parameters/OwnerIdRequired'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingSagaRequest'
      responses:
        '201':
          $ref: '#/components/responses/SagaBooking'
        '202':
          $ref: '#/components/responses/SagaBooking'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /sagas/bookings/{bookingId}/tickets:
    parameters:
      - $ref: '#/components/parameters/BookingId'
      - $ref: '#/components/parameters/OwnerId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Orquestador]
      operationId: sagaIssueTickets
      summary: Saga "Emitir boletos" (Offers BOOKED → TICKETED, Bookings emite; `issued 0` si ya estaban)
      responses:
        '200':
          description: Boletos emitidos (o ya emitidos)
          content:
            application/json:
              schema:
                $ref: './vuelos-openapi-v2.yaml#/components/schemas/TicketIssuanceResponse'
        '202':
