asyncapi: 3.0.0
info:
  title: EcoAirlines — eventos (bus interno, webhooks a Booking y eventos de Booking)
  version: 1.0.0
  description: "Contrato de **eventos** de EcoAirlines (Reto 2). Documenta el bus interno, lo que sale hacia Booking Prototipo y lo\
    \ que llega\ndesde Booking. Decisiones D4, D33, D34, D37, D40 y D41 de `PLAN/PLAN.md`; contrato de Vuelos v2, §8.\n\n### Formato:\
    \ CloudEvents 1.0 (contrato v2 §8)\nTodos los mensajes son CloudEvents en modo estructurado (`application/cloudevents+json`): `specversion`,\
    \ `type`, `source =\n/aerolineas/ecoairlines/vuelos`, `id` (único, para deduplicar), `time`, `subject` (bookingId, holdId o vuelo/fecha),\n\
    `correlationid` (el `X-Correlation-Id` del proceso que lo originó, **sin cambios**) y `data`.\n- `type` **público**: `ec.edu.epn.booking.vuelos.<evento>`\
    \ (los define el contrato del grupo; sus schemas se referencian).\n- `type` **interno**: `ec.ecoairlines.internal.<evento>` (nunca\
    \ sale de EcoAirlines).\n\n### Bus interno — RabbitMQ (D8)\n- Exchange `ecoairlines.events`, tipo **topic**, durable. **Routing\
    \ key = nombre corto** del evento (`booking.confirmed`).\n- Propiedades AMQP: `message_id` = `id` del CloudEvent, `correlation_id`\
    \ = `correlationid`, `content_type` =\n  `application/cloudevents+json`, `delivery_mode` = 2 (persistente); cabecera `x-request-id`.\n\
    - Cada productor publica desde su **outbox** (ESB y MS.G.Offers): el evento se guarda en la misma transacción que el cambio (en\
    \ el\n  ESB, en el mismo paso de la saga) y un relé lo envía después con **confirmación del broker**, así no se pierden ni se publican\n\
    \  eventos de cambios que no se guardaron. Entrega \"al menos una vez\": un evento puede repetirse (la réplica se cayó entre\n \
    \ publicar y marcar), por eso los consumidores son **idempotentes** y deduplican por `id`.\n- **Reintentos y cola de fallidos**\
    \ (por cada cola de consumidor `<cola>`): si el consumidor falla, el mensaje espera en\n  `<cola>.retry.1s`, `.5s`, `.30s` y `.2m`\
    \ (colas con TTL fijo cuyo *dead letter* lo devuelve SOLO a `<cola>`, sin duplicarlo en\n  los otros consumidores) con la cabecera\
    \ `x-attempts`. Al **5.º intento** fallido va al exchange `ecoairlines.dlx` (*direct*,\n  routing key = `<cola>`) y queda en `<cola>.dlq`\
    \ con `x-last-error`, `x-original-routing-key` y `x-failed-at`; el consumidor\n  escribe una línea de ALERTA (la alerta de la plataforma\
    \ de observabilidad llega en V2.16). Un mensaje ilegible va directo a\n  `<cola>.dlq`.\n\n| Cola | Enlaces (routing keys) | Consumidor\
    \ |\n|------|------------------------|------------|\n| `webhooks.events` (+ `.retry.*`, `.dlq`) | `#` (todo) | MS.G.Webhooks: guarda\
    \ el historial y entrega los **públicos** a los suscriptores |\n| `flight-status.schedule` (+ `.retry.*`, `.dlq`) | `schedule.published`\
    \ | MS.G.FlightStatus: proyección `scheduled_flights` (D4) |\n| `esb.deferred` ← `esb.deferred.wait.<demora>` (TTL + DLX) | — (cola\
    \ directa) | ESB: retoma una saga pendiente en el momento de su reintento (2 s, 10 s, 30 s, 2 min, 10 min, 30 min). Es un acelerador:\
    \ si RabbitMQ no está, el ESB la encuentra igual en `saga_log` |\n\n### Hacia Booking\n1. **Webhooks** (obligatorio): MS.G.Webhooks\
    \ hace `POST` a la URL de cada suscripción con el CloudEvent, firmado con\n   `X-Webhook-Signature: sha256=<HMAC-SHA256(secret,\
    \ cuerpo)>`; reintentos a 1 min, 5 min, 30 min, 2 h y 6 h. Solo eventos\n   **públicos**, y de `booking.*` / `hold.*` solo los **del\
    \ canal del partner** (D40). Respaldo: `GET /vuelos/eventos`.\n2. **Stock** (obligatorio): no es un evento de este contrato; MS.G.Offers\
    \ llama por gRPC a `PushStockUpdate`\n   (`booking-inventory.proto`, D33).\n3. **Puente al bus del ecosistema** (opcional, si el\
    \ grupo lo pide): el ESB republica los públicos en el exchange\n   `booking.events` con routing key `vuelos.<evento>`.\n\n### Desde\
    \ Booking (hallazgo BKG-01: canal por confirmar)\n`payment.confirmed` → saga \"Emitir boletos\" · `payment.failed` → saga \"Pago\
    \ fallido\" · `package.cancelled` → saga \"Cancelar\"\ncon `SAGA_COMPENSATION`. Mientras el grupo responde, el ESB acepta las dos\
    \ vías documentadas abajo (AMQP en `booking.events` y\nwebhook firmado). Sin duplicados (D34): `inbound_events` por `id`, y sagas\
    \ idempotentes.\n\n### Datos sensibles\nNingún evento lleva tokens, datos de tarjeta ni datos de salud. `booking.assistance_requested`\
    \ solo dice **que** cambió la\nasistencia de un pasajero, no cuál es.\n"
  license:
    name: Uso académico — Integración de Sistemas (sin licencia de distribución)
defaultContentType: application/cloudevents+json
servers:
  ecoairlines-bus:
    host: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ interno de EcoAirlines (Docker Compose / nube). Exchange `ecoairlines.events`.
  booking-bus:
    host: booking.epn.edu.ec:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: Bus del ecosistema de Booking (exchange `booking.events`). Opcional; credenciales por confirmar (BKG-01).
  booking-webhooks:
    host: rda1-backend-integracion-sistemas.onrender.com
    protocol: https
    description: Receptor de webhooks de Booking (la URL exacta es la de cada suscripción).
  ecoairlines-public:
    host: ecoairlines-gateway.azurecontainerapps.io
    protocol: https
    description: Gateway público de EcoAirlines (entrada de eventos de Booking por webhook, BKG-01).
