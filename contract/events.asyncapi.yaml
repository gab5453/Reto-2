components:
  schemas:
    CloudEventEnvelope:
      type: object
      required:
      - specversion
      - type
      - source
      - id
      - time
      - correlationid
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        type:
          type: string
        source:
          type: string
          const: /aerolineas/ecoairlines/vuelos
        id:
          type: string
          description: Único; los consumidores deduplican por él
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
          const: application/json
        correlationid:
          type: string
          maxLength: 100
          description: X-Correlation-Id del proceso (sin cambios)
        data:
          type: object
    UserChange:
      type: object
      required:
      - sub
      - role
      - status
      - actorId
      properties:
        sub: &id003
          type: string
          format: uuid
        role:
          type: string
          enum:
          - CUSTOMER
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
        actorId: *id003
        reason:
          type: string
          maxLength: 200
    PartnerChange:
      type: object
      required:
      - clientId
      - status
      - actorId
      properties:
        clientId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
        actorId: *id003
        reason:
          type: string
          maxLength: 200
    ScheduledFlight:
      type: object
      required:
      - flightNumber
      - date
      - routeId
      - origin
      - destination
      - departureAt
      - arrivalAt
      - aircraftType
      - registration
      description: Igual que ScheduledFlight de ms-g-schedule.openapi.yaml
      properties:
        flightNumber:
          type: string
        date:
          type: string
          format: date
        routeId:
          type: string
        origin:
          type: string
        destination:
          type: string
        departureAt:
          type: string
          format: date-time
        arrivalAt:
          type: string
          format: date-time
        aircraftType:
          type: string
        registration:
          type: string
    DeferredTask:
      type: object
      required:
      - sagaId
      - sagaType
      - step
      - attempt
      - notBefore
      properties:
        sagaId: *id003
        sagaType:
          type: string
          enum:
          - CREATE_BOOKING
          - ISSUE_TICKETS
          - PAYMENT_FAILED
          - CHANGE_SEATS
          - CHECK_IN
          - CANCEL_BOOKING
          - CHANGE_DATE
          - ADD_BAGGAGE
          - ASSISTANCE_READY
          - UPDATE_FLIGHT_STATUS
          - SAVE_PRICES
          - PUBLISH_TIMETABLE
        step:
          type: string
          example: offers.release
          description: Paso de la saga que quedó pendiente
        attempt:
          type: integer
          minimum: 1
        notBefore:
          type: string
          format: date-time
        correlationId:
          type: string
  messages:
    HoldCreated:
      name: hold.created
      title: hold.created (público)
      summary: Se bloquearon asientos (hold creado).
      contentType: application/cloudevents+json
      correlationId: &id004
        $ref: '#/components/correlationIds/CloudEventCorrelation'
      payload:
        schemaFormat: application/vnd.oai.openapi;version=3.0.0
        schema:
          $ref: ./vuelos-openapi-v2.yaml#/components/schemas/EventHoldCreated
      bindings: &id005
        amqp:
          contentEncoding: utf-8
          messageType: cloudevent
          bindingVersion: 0.3.0
      x-cloudevent-type: ec.edu.epn.booking.vuelos.hold.created
      x-public: true
      headers:
        type: object
        description: 'Cabeceras: las HTTP de la entrega por webhook y, en hold.* y booking.*, la AMQP `x-owner-id` del bus interno'
        properties:
          X-Webhook-Signature:
            type: string
            pattern: ^sha256=[0-9a-f]{64}$
            description: Solo en la entrega por webhook
          X-Correlation-Id:
            type: string
            maxLength: 100
            description: Solo en la entrega por webhook
          x-owner-id:
            type: string
            maxLength: 200
            description: 'Solo en el bus interno (cabecera AMQP), nunca en la entrega: dueño del hold o la reserva (D29: `sub` de la
              web o `partner:<clientId>:<X-User-Id>`). Lo pone quien publica (Offers en hold.*, el ESB en booking.*) y MS.G.Webhooks
              lo usa para el filtro D40.'
