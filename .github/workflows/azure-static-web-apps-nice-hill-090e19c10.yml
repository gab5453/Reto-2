name: Deploy Web (Azure Static Web Apps)

# Compila la web con Node 24 y las URLs públicas (Vite las fija al compilar) y sube `dist` a la Static Web App.
on:
  push:
    branches:
      - main
    paths:
      - 'ecoairlines-web/**'
      - '.github/workflows/azure-static-web-apps-nice-hill-090e19c10.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'ecoairlines-web/**'
  workflow_dispatch:

# La clave pública de la pasarela es la PAYMENT_PUBLISHABLE_KEY de infra/cloud/.env, en una variable del repositorio (no es secreta).
env:
  VITE_GRAPHQL_URL: https://ecoairlines-reto2.northcentralus.cloudapp.azure.com/api/graphql
  VITE_PAYMENT_API_URL: https://ecoairlines-reto2.northcentralus.cloudapp.azure.com/payment-api
  VITE_PAYMENT_PUBLIC_KEY: ${{ vars.PAYMENT_PUBLISHABLE_KEY }}

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ecoairlines-web/package-lock.json

      - name: Instalar, revisar y compilar
        working-directory: ecoairlines-web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Desplegar
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_HILL_090E19C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "/ecoairlines-web/dist" # ya compilado en el paso anterior
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_HILL_090E19C10 }}
          action: "close"
