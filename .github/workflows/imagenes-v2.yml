name: Imágenes v2 (GitHub Container Registry)

# CD-1 (Informacion_General/Pruebas.md §10, opción B): cuando la CI termina EN VERDE en la rama del Reto 2, se compilan las 18
# imágenes para ARM64 (la VM de Azure es ARM) y se suben a ghcr.io/<dueño>/ecoairlines-<servicio>, con la etiqueta del commit
# (`<sha>-arm64`) y `latest-arm64`. La VM ya no compila: el responsable despliega una versión exacta con
#   bash scripts/cloud/desplegar-imagenes.sh <host> <sha>
# Nada se despliega solo: subir una imagen no cambia la nube. Las imágenes no llevan secretos (se pasan al arrancar, cloud/.env).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [feature/v2-microservicios]
  workflow_dispatch:

concurrency:
  group: imagenes-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compilar:
    # Solo si la CI pasó (el «gate»): una imagen nunca sale de un commit con pruebas en rojo.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        servicio:
          - { nombre: esb, dir: services/esb }
          - { nombre: gateway, dir: services/gateway }
          - { nombre: payment-api, dir: services/externos/payment-api }
          - { nombre: booking-simulado, dir: services/externos/booking-simulado }
          - { nombre: ms-g-identity, dir: services/gestion/ms-g-identity }
          - { nombre: ms-g-schedule, dir: services/gestion/ms-g-schedule }
          - { nombre: ms-g-offers, dir: services/gestion/ms-g-offers }
          - { nombre: ms-g-bookings, dir: services/gestion/ms-g-bookings }
          - { nombre: ms-g-check-in, dir: services/gestion/ms-g-check-in }
          - { nombre: ms-g-post-sale, dir: services/gestion/ms-g-post-sale }
          - { nombre: ms-g-flight-status, dir: services/gestion/ms-g-flight-status }
          - { nombre: ms-g-webhooks, dir: services/gestion/ms-g-webhooks }
          - { nombre: ms-g-customers, dir: services/gestion/ms-g-customers }
          - { nombre: ms-vuelos, dir: services/respuesta/ms-vuelos }
          - { nombre: ms-reservas, dir: services/respuesta/ms-reservas }
          - { nombre: ms-postventa, dir: services/respuesta/ms-postventa }
          - { nombre: ms-clientes, dir: services/respuesta/ms-clientes }
          - { nombre: ms-admin, dir: services/respuesta/ms-admin }
    env:
      # El commit que probó la CI (en workflow_run, `github.sha` es el de la rama por defecto, no el probado).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Siempre se compilan las 18 (con la caché, una sin cambios tarda segundos): así cada commit tiene TODAS sus imágenes y se
      # despliega una versión exacta y completa (y se puede volver a la anterior).
      - name: Compilar ${{ matrix.servicio.nombre }} (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/node-service.Dockerfile
          build-args: SERVICE_DIR=${{ matrix.servicio.dir }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecoairlines-${{ matrix.servicio.nombre }}:${{ env.SHA }}-arm64
            ghcr.io/${{ github.repository_owner }}/ecoairlines-${{ matrix.servicio.nombre }}:latest-arm64
          # Vincula la imagen con el repositorio (su página en GitHub y sus permisos).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.servicio.nombre }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio.nombre }}-arm64
