name: CI

# CI-1 (Informacion_General/Pruebas.md §8, §11): protege en cada push y pull request lo que ya existe. Orden «fail fast» (Semana 9,
# §9.5): primero lo más rápido y barato; si una etapa falla, las siguientes no corren.
#   1. calidad ........ tipos (tsc) + lint (oxlint y luego ESLint con reglas de tipos, CI-2) + auditoría de dependencias (SEG-1)
#   2. pruebas ........ unitarias + integración con cobertura (mínimos en dominios y motor de sagas, CI-2)
#   3. infraestructura  las pruebas con PostgreSQL y RabbitMQ REALES (contenedores de servicio), que sin ellos se omiten
#   4. contratos ...... Pact (CT-1): los consumidores generan contract/pacts y los proveedores reales los verifican
#   web (en paralelo) . lint + pruebas (Vitest + jsdom) + compilación de ecoairlines-web
#   5. e2e ............ E2E-1: el sistema completo con docker compose + conformidad v2 (54) + flujos críticos con Playwright (8)
# Sin secretos: las bases y el broker son desechables y viven solo mientras dura el trabajo.
on:
  push:
    branches: [feature/v2-microservicios, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: 1. Calidad (tipos y lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      # Después de los tipos: ESLint necesita la solución compilada (`@ecoairlines/shared` se resuelve a su dist).
      - name: Lint (oxlint + ESLint con tipos)
        run: npm run lint
      # SEG-1 (S-2): falla con un aviso alto o crítico en dependencias de PRODUCCIÓN (salvo excepciones con fecha).
      - name: Auditoría de dependencias
        run: node scripts/ci/auditoria.mjs raíz

  pruebas:
    name: 2. Pruebas unitarias e integración
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas con cobertura
        run: npm run test:coverage
      - name: Resumen de cobertura
        if: always()
        run: node scripts/ci/resumen-cobertura.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  infraestructura:
    name: 3. Integración con PostgreSQL y RabbitMQ reales
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d pruebas"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1.8-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-solo-pruebas
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20
    # Cada prueba crea su propio esquema (o exchange y colas) y lo borra al terminar: todas comparten la misma base y el mismo broker.
    env:
      PG: postgres://ci:ci-solo-pruebas@localhost:5432/pruebas
      BUS_TEST_URL: amqp://ci:ci-solo-pruebas@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas con infraestructura real
        run: |
          for svc in ESB IDENTITY SCHEDULE OFFERS BOOKINGS CHECK_IN POST_SALE FLIGHT_STATUS WEBHOOKS PAYMENT; do
            export "${svc}_TEST_DATABASE_URL=$PG"
          done
          npm run test:infra -- --reporter=default --reporter=json --outputFile=resultados-infra.json
      - name: Ninguna se omitió
        run: node scripts/ci/sin-omitidas.mjs resultados-infra.json

  contratos:
    name: 4. Contratos (Pact)
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sin estadísticas de uso de Pact ni de sus dependencias (no se envía nada a terceros).
    env:
      PACT_DO_NOT_TRACK: 'true'
      SCARF_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Consumidores (generan los contratos)
        run: npm run test:pact
      - name: Los contratos del repositorio están al día
        run: |
          if ! git diff --exit-code -- contract/pacts; then
            echo "::error::Un consumidor cambió lo que espera y su contrato no se subió: ejecuta 'npm run test:pact' y sube contract/pacts."
            exit 1
          fi
      - name: Proveedores (verifican los contratos)
        run: npm run test:pact:verify

  e2e:
    name: 5. E2E (sistema completo)
    # La etapa más cara: solo si todo lo anterior pasó (fail fast). El sistema vive en el runner y se borra al terminar: nunca se
    # toca la nube ni las reservas de Booking. Las claves son las de desarrollo de infra/docker-compose.yml (sin secretos).
    needs: [infraestructura, contratos, web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ecoairlines-web/package-lock.json
      - run: npm ci
      - name: Dependencias de la web (Playwright la compila y la sirve)
        run: npm ci
        working-directory: ecoairlines-web
      - name: Navegador (Chromium de Playwright)
        run: npx playwright install --with-deps chromium
      - name: Levantar el sistema (docker compose, sin Prometheus, Grafana ni Alertmanager)
        run: npm run e2e:up
      - name: Conformidad con el contrato v2 (caja negra, como Booking)
        run: |
          npm run e2e:conformidad -- --reporter=default --reporter=json --outputFile=resultados-conformidad.json
          node scripts/ci/sin-omitidas.mjs resultados-conformidad.json "Conformidad v2"
      - name: Flujos críticos en el navegador (Playwright)
        run: npm run test:e2e
      - name: Logs de los contenedores (si algo falló)
        if: failure()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml logs --no-color --timestamps > logs-e2e.txt
      - name: Reporte y logs (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reporte
          path: |
            playwright-report/
            test-results/
            logs-e2e.txt
          retention-days: 7
      - name: Apagar el sistema
        if: always()
        run: npm run e2e:down

  web:
    name: Web (lint, pruebas y compilación)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ecoairlines-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ecoairlines-web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Auditoría de dependencias
        run: node ../scripts/ci/auditoria.mjs web
      - name: Pruebas de la web
        run: npm test
      - name: Compilación
        run: npm run build
