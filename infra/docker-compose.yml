  # Gateway (V2.13): la única puerta pública. REST del contrato v2 (/api/v2/vuelos/*, Booking), GraphQL (/api/graphql, la
  # web) y Swagger (/api/docs). Solo habla con los 5 MS de respuesta.
  gateway:
    build:
      context: ..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_DIR: services/gateway
    environment:
      PORT: "8080"
      MS_VUELOS_URL: http://ms-vuelos:8080
      MS_RESERVAS_URL: http://ms-reservas:8080
      MS_POSTVENTA_URL: http://ms-postventa:8080
      MS_CLIENTES_URL: http://ms-clientes:8080
      MS_ADMIN_URL: http://ms-admin:8080
      IDENTITY_JWKS_URL: http://ms-g-identity:8080/.well-known/jwks.json
      CORS_ORIGINS: http://localhost:5173
      # En local la introspección ayuda a probar; en la nube queda apagada (NODE_ENV=production).
      GRAPHQL_INTROSPECTION: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      UV_THREADPOOL_SIZE: 16
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    ports:
      # 8088 en el host: Windows suele reservar el 8080 (http.sys). Se cambia con GATEWAY_HOST_PORT.
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8088}:8080"
    depends_on:
      ms-vuelos:
        condition: service_healthy
      ms-reservas:
        condition: service_healthy
      ms-postventa:
        condition: service_healthy
      ms-clientes:
        condition: service_healthy
      ms-admin:
