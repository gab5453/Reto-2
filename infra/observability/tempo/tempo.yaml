# Tempo (V2.16, D50): trazas por OTLP (desde el Collector). Disco local, 7 días.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
backend_worker:
  compaction:
    block_retention: 168h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
# T-5 (tiempo real): una traza se puede buscar ~2–3 s después de ocurrir. Por defecto Tempo 3 excluye de las búsquedas los
# últimos 30 s (query_end_cutoff) y espera 5 s sin spans nuevos antes de cerrar una traza en memoria (max_trace_idle): medido,
# un paso tardaba 31 s en aparecer. Con 1 s y 2 s, el panel ve el proceso casi mientras ocurre.
query_frontend:
  query_end_cutoff: 1s
live_store:
  max_trace_idle: 2s
  flush_check_period: 1s
# PLAN_Telemetria_Asientos T-3: métricas a partir de las trazas, escritas en Prometheus (remote write). En modo monolítico el
# distribuidor se las pasa al generador en el mismo proceso (Tempo 3: sin Kafka).
# - service-graphs: el grafo de servicios (traces_service_graph_request_total, _failed_total, _server_seconds… por arista
#   cliente → servidor), lo que dibuja el «Mapa del sistema en vivo» de Grafana y, en T-4, la vista «Recorrido».
# - span-metrics: peticiones, errores y duración por servicio y operación (traces_spanmetrics_*).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      # Nodos «virtuales» para lo que no tiene spans de servidor propios (PostgreSQL, la Payment API, RabbitMQ).
      enable_virtual_node_label: true
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
usage_report:
  reporting_enabled: false
