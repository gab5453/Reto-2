# Orígenes de datos de Grafana (V2.16, D50), versionados: Prometheus, Loki y Tempo, enlazados (de una traza a sus logs).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
      # T-3: grafo de servicios (las métricas que escribe el metrics-generator de Tempo en Prometheus) y grafo de nodos de una traza.
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      # Búsqueda por correlation ID en el editor de TraceQL.
      search:
        filters:
          - id: correlation-id
            tag: correlation_id
            operator: '='
            scope: span
