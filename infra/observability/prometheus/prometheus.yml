# Prometheus (V2.16, D50): métricas de los servicios (vía el Collector) y de RabbitMQ; reglas de alerta → Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: servicios
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: rabbitmq
    # Por cola (con la etiqueta `queue`): el endpoint por defecto solo da totales.
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
