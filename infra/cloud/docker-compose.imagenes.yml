# CD-1 (Informacion_General/Pruebas.md §10, opción B): la nube con las imágenes que compiló GitHub Actions (.github/workflows/
# imagenes-v2.yml), en lugar de compilarlas en la VM. Se agrega DESPUÉS de cloud/docker-compose.cloud.yml:
#   IMAGE_TAG=<sha del commit> docker compose -f docker-compose.yml -f cloud/docker-compose.cloud.yml \
#     -f cloud/docker-compose.imagenes.yml --env-file cloud/.env pull && ... up -d
# Lo ejecuta scripts/cloud/desplegar-imagenes.sh. IMAGE_TAG es obligatorio: siempre se despliega una versión exacta (y volver a la
# anterior es desplegar su sha). Las imágenes no llevan secretos: los recibe cada servicio de cloud/.env al arrancar.
# `pull_policy: missing` + `build` intacto: si alguna vez hiciera falta, `--build` sigue compilando en la VM como antes.
x-imagen: &imagen
  pull_policy: missing

services:
  booking-simulado:
    <<: *imagen
    image: ghcr.io/${GHCR_OWNER:-gab5453}/ecoairlines-booking-simulado:${IMAGE_TAG:?falta IMAGE_TAG (sha del commit)}-arm64
  esb:
    <<: *imagen
